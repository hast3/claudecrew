      if (confirm(`Start a fresh conversation with ${a.name}? It will forget this chat's context.${w}`)) api(`/api/agents/${id}/reset`);
    };
    if ($('#agStop')) $('#agStop').onclick = () => api(`/api/agents/${id}/stop`);
    $('#agMention').onclick = () => { $('#agentDlg').close(); mention(id); };
  }
  function bindLook(id) {
    $('#agPin').onclick = () => { crewPins = crewPins.includes(id) ? crewPins.filter((x) => x !== id) : [...crewPins, id]; saveCrewPrefs(); };
    $('#agGroup').onchange = () => { const v = $('#agGroup').value.trim(); if (v) crewGroups[id] = v; else delete crewGroups[id]; saveCrewPrefs(); };
    $('#agL').onclick = () => moveAgent(id, -1);
    $('#agR').onclick = () => moveAgent(id, 1);
    document.querySelectorAll('.swatches button').forEach((b) => b.onclick = () => { if (b.dataset.c) crewColors[id] = b.dataset.c; else delete crewColors[id]; saveCrewPrefs(); });
    const cc = $('#agColorCustom'); if (cc) cc.onchange = () => { crewColors[id] = cc.value; saveCrewPrefs(); };
    const setIcon = (e) => { e = (e || '').trim(); if (e) crewIcons[id] = e; else delete crewIcons[id]; saveCrewPrefs(); };
    document.querySelectorAll('#agIcons button').forEach((b) => b.onclick = () => setIcon(b.dataset.e));
    $('#agEmoji').onchange = () => setIcon($('#agEmoji').value);
    $('#agPic').onclick = () => $('#agPicFile').click();
    if ($('#agPicX')) $('#agPicX').onclick = () => { delete crewPics[id]; saveCrewPrefs(); renderAgentDialog(id); };
    $('#agPicFile').onchange = (ev) => {
      const f = ev.target.files[0]; if (!f) return;
      const img = new Image(); img.onload = () => {
        const c = document.createElement('canvas'), n = 96, k = Math.max(n / img.width, n / img.height);
        c.width = c.height = n; const x = c.getContext('2d');
        x.drawImage(img, (n - img.width * k) / 2, (n - img.height * k) / 2, img.width * k, img.height * k);
        crewPics[id] = c.toDataURL('image/jpeg', 0.85); saveCrewPrefs(); renderAgentDialog(id);
      };
      img.src = URL.createObjectURL(f);
    };
  }

  function mention(id) {
    const ta = $('#input');
    const tag = '@' + id + ' ';
    if (!ta.value.includes(tag)) ta.value = tag + ta.value;
    ta.focus();
    autosize();
  }
  function jumpTo(id) {
    const x = id && msgs.get(id);
    if (!x) return;
    x.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    x.el.animate([{ background: 'color-mix(in srgb, var(--accent) 18%, transparent)' }, { background: 'transparent' }], { duration: 1600 });
  }

  // ---------- messages ----------
  function nameOf(id) { return id === 'user' ? userName : agents[id]?.name || id; }

  function renderExtras(m, box) {
    const f = flags[m.id] || {};
    let html = '';
    if (m.attachments?.length) {
      const imgs = m.attachments.filter((a) => a.type?.startsWith('image/'));
      const files = m.attachments.filter((a) => !a.type?.startsWith('image/'));
      if (imgs.length) html += `<div class="thumbs">${imgs.map((a) => `<a class="pic" href="/api/uploads/${esc(a.id)}"><img src="/api/uploads/${esc(a.id)}" alt="${esc(a.name)}" loading="lazy"></a>`).join('')}</div>`;
      if (files.length) html += `<div class="thumbs">${files.map((a) => `<a class="file" download="${esc(a.name)}" href="/api/uploads/${esc(a.id)}">${ic('file')} ${esc(a.name)}</a>`).join('')}</div>`;
    }
    if (m.denials?.length) {
      const dl = f.approved ? ic('check') + ' Approved' : f.denied ? ic('blocked') + ' Denied' : 'A command was refused';
      html += `<details class="card denynote"><summary>${dl} · ${esc(m.denials[0].label)}${m.denials.length > 1 ? ` +${m.denials.length - 1}` : ''}</summary><ul>${m.denials.map((d) => `<li><span class="p" title="${esc(d.rule)}">${esc(d.label)}</span>${d.reason ? `<div class="small">Why it asks: ${esc(d.reason)}</div>` : ''}</li>`).join('')}</ul>
        ${f.approved || f.denied ? '' : `<div class="row" style="margin-top:6px"><button class="btn primary" data-approve>Approve once and continue</button><span class="small">Only these exact actions, for its next run. The agent carries on another way without it.</span></div>`}</details>`;
    }
    if (m.changes?.files?.length) {
      const c = m.changes;
      const undone = f.undone;
      html += `<div class="card"><h4>${undone ? ic('reset') + ' Undone · ' : ''}${c.files.length + (c.more || 0)} file${c.files.length + (c.more || 0) === 1 ? '' : 's'} changed
        ${c.repo && !undone ? '<span class="grow"></span><button class="btn" data-undo>Undo</button>' : ''}</h4>
        <ul>${c.files.slice(0, 30).map((x) => `<li><span class="st ${x.status}">${x.status === 'added' ? 'A' : x.status === 'deleted' ? 'D' : 'M'}</span><span class="p" title="${esc(x.path)}">${esc(x.path)}</span>${c.repo ? `<button class="linkbtn" data-diff="${esc(x.path)}">diff</button>` : ''}</li>`).join('')}</ul>
        ${c.files.length > 30 || c.more ? `<div class="small">…and ${c.files.length - 30 + (c.more || 0)} more</div>` : ''}
        ${undone?.skipped?.length ? `<div class="small">Not undone: ${undone.skipped.map((s) => esc(s.path)).join(', ')}</div>` : ''}
        ${c.repo ? '' : '<div class="small">Not a git folder, so no diff or undo.</div>'}</div>`;
    }
    if (m.stats && m.from !== 'user') {
      html += `<div class="stats">${[prettyModel(m.model), m.stats.ms ? fmtDur(m.stats.ms) : ''].filter(Boolean).join(' · ')}</div>`;
    }
    box.innerHTML = html;
    box.style.display = html ? '' : 'none';
    box.querySelector('[data-approve]')?.addEventListener('click', (e) => { e.target.disabled = true; api('/api/approve', { id: m.id }); });
    box.querySelector('[data-undo]')?.addEventListener('click', async (e) => {
      if (!confirm(`Undo ${nameOf(m.from)}'s changes to ${m.changes.files.length} file(s)? Files changed again since then are left alone.`)) return;
      e.target.disabled = true;
      const r = await api(`/api/changes/${m.id}/undo`);
      if (!r.ok) e.target.disabled = false;
    });
    box.querySelectorAll('[data-diff]').forEach((b) => b.addEventListener('click', () => showDiff(m, b.dataset.diff)));
  }

  async function showDiff(m, file) {
    $('#diffTitle').textContent = file;
    $('#diffBody').innerHTML = '<div class="small">Loading…</div>';
    open('#diffDlg');
    const r = await fetch(`/api/changes/${m.id}/diff?path=${encodeURIComponent(file)}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('#diffBody').innerHTML = `<div class="small">${esc(j.error || 'Could not load the diff.')}</div>`; return; }
    const lines = String(j.diff).split('\n').map((l) => {
      const cls = l.startsWith('+++') || l.startsWith('---') || l.startsWith('diff ') || l.startsWith('index ') ? 'h'
        : l.startsWith('@@') ? 'h' : l.startsWith('+') ? 'a' : l.startsWith('-') ? 'd' : '';
      return `<span class="${cls}">${esc(l) || ' '}</span>`;
    }).join('');
    $('#diffBody').innerHTML = `<div class="small">The file now, compared with how it was just before ${esc(nameOf(m.from))}'s turn (${time(m.ts)}).</div><pre class="diff">${lines}</pre>`;
  }

  const REACTS = ['👍', '❤️', '😂', '🎉', '👀', '🤔', '🔥', '😬'];
  let reactions = {}, pins = [], asks = [];
  function paintPins() {
    $('#pinCount').textContent = pins.length ? `(${pins.length})` : '';
    document.querySelectorAll('.reacts').forEach(paintReacts);
    if (!$('#pinDlg').open) return;
    $('#pinBody').innerHTML = pins.length ? pins.map((p) => `<div class="job" data-id="${p.id}"><div class="small">${esc(nameOf(p.from))} · ${new Date(p.ts).toLocaleString()}</div><div class="bubble">${md(p.text)}</div><div class="row"><button class="btn" data-unpin>Unpin</button></div></div>`).join('') : '<div class="small">Nothing pinned. Tap the pin under any message to keep it here.</div>';
    $('#pinBody').querySelectorAll('[data-unpin]').forEach((b) => b.onclick = () => api('/api/pin', { id: b.closest('.job').dataset.id }));
  }
  $('#pinBtn').onclick = () => { open('#pinDlg'); paintPins(); };
  function reactBar(id, mine) {
    const box = document.createElement('div');
    box.className = 'reacts'; box.dataset.rid = id; if (mine) box.dataset.mine = '1';
    paintReacts(box);
    return box;
  }
  function paintReacts(box) {
    const id = box.dataset.rid, list = reactions[id] || [], pinned = pins.some((p) => p.id === id);
    box.classList.toggle('has', list.length > 0);
    box.innerHTML = list.map((e) => `<button class="rchip" data-e="${e}" title="Remove">${e}</button>`).join('') + `<button class="radd" title="React">${ic('smile')}</button>`
      + `<button class="radd rpin${pinned ? ' on' : ''}" title="${pinned ? 'Unpin' : 'Pin'}" style="${pinned ? 'opacity:1' : ''}">${ic('pin')}</button>`;
    box.querySelector('.rpin').onclick = () => api('/api/pin', { id });
    if (box.dataset.mine) {
      const ub = document.createElement('button');
      ub.className = 'radd'; ub.title = 'Unsend'; ub.innerHTML = ic('trash');
      ub.onclick = () => { if (confirm('Unsend this message? Agents that have not started on it will never see it.')) api('/api/unsend', { id }); };
      box.appendChild(ub);
    }
    box.querySelectorAll('.rchip').forEach((b) => b.onclick = () => api('/api/react', { id, emoji: b.dataset.e }));
    box.querySelector('.radd').onclick = (ev) => {
      ev.stopPropagation();
      document.querySelectorAll('.rpick').forEach((x) => x.remove());
      const pk = document.createElement('div'); pk.className = 'rpick';
      pk.innerHTML = REACTS.map((e) => `<button data-e="${e}">${e}</button>`).join('');
      pk.onclick = (e2) => { const b = e2.target.closest('button'); if (b) { api('/api/react', { id, emoji: b.dataset.e }); pk.remove(); } };
      const r = ev.target.getBoundingClientRect();
      pk.style.left = Math.max(4, Math.min(r.left, innerWidth - 290)) + 'px';
      pk.style.top = Math.max(4, r.top - 40) + 'px';
      document.body.appendChild(pk);
      setTimeout(() => document.addEventListener('click', () => pk.remove(), { once: true }), 0);
    };
  }
  function render(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const log = $('#log');
    log.querySelector('.empty')?.remove();
    const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160;
    let el;
    if (m.kind === 'activity') {
      el = document.createElement('div');
      el.className = 'activity';
      el.innerHTML = `${avatar(m.from, 'mini')} ${esc(nameOf(m.from))} · ${esc(m.text)}`;
    } else if (m.kind === 'system') {
      el = document.createElement('div');
      el.className = 'note';
      el.textContent = m.text;
      if (m.changes) {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'max-width:520px;margin:6px auto 0;text-align:left';
        el.appendChild(wrap);
        renderExtras(m, wrap);
      }
    } else {
      const you = m.from === 'user';
      el = document.createElement('div');
      el.className = `msg${you ? ' you' : ''}${m.kind === 'error' ? ' err' : ''}`;
      if (!you) { el.dataset.from = m.from; paintMsg(el, m.from); }
      const to = (m.to || []).map((t) => `<span class="tag">→ ${esc(nameOf(t))}</span>`).join('');
      const needs = m.needs ? `<span class="tag needs" title="${esc(m.needs)}">Needs you</span>` : '';
      el.innerHTML = `${you ? '' : `<div class="av">${avatar(m.from)}</div>`}
        <div class="body"><div class="meta">${you ? '' : `<b>${esc(nameOf(m.from))}</b>`}<span>${time(m.ts)}</span>${to}${needs}</div>
        <div class="bubble">${m.kind === 'error' ? esc(m.text) : md(m.text)}</div><div class="extras"></div></div>`;
      el.querySelector('.body').appendChild(reactBar(m.id, you));
      renderExtras(m, el.querySelector('.extras'));
      // One-tap PROCEED on the newest agent reply: tells that agent to go ahead without waiting or asking.
      document.querySelectorAll('.proceedBtn').forEach((b) => b.remove());
      // Only offered when the reply is waiting on the owner: flagged "Needs you" or ending in a question.
      if (!you && m.kind === 'chat' && (m.needs || /\?[\s*_)\]"'`]*$/.test(String(m.text || '').trim()))) {
        const pb = document.createElement('button');
        pb.className = 'btn primary proceedBtn'; pb.textContent = 'PROCEED';
        pb.onclick = async () => {
          pb.disabled = true;
          await api('/api/send', { text: `@${m.from} Proceed. Go ahead now; do not wait, ask, or hold off for me.`, attachments: [] });
          pb.remove();
        };
        el.querySelector('.extras').appendChild(pb);
      }
      // A finished reply replaces that agent's live draft.
      if (!you && drafts.has(m.from)) { drafts.get(m.from).remove(); drafts.delete(m.from); }
    }
    msgs.set(m.id, { m, el });
    if (typeof sel === 'string' && sel) el.hidden = !matches(m); noteUnread(m);
    // Live "typing" bubbles stay at the bottom; everything else goes above them.
    const draftFirst = [...drafts.values()][0];
    if (draftFirst) log.insertBefore(el, draftFirst); else log.appendChild(el);
    if (nearBottom || m.from === 'user') scroller.scrollTop = scroller.scrollHeight;
    return el;
  }

  const TDOTS = '<span class="tdots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
  // While an agent is working, keep a live bubble in the chat: looping dots until text
  // starts streaming, then the text itself. Gone once the agent stops or its reply lands.
  // In a one-agent or group chat, only the chosen agents' live bubbles show.
  function draftShown(agent) { return !sel || sel.split(',').includes(agent); }
  function renderDraft(agent, text) {
    let el = drafts.get(agent);
    if (!text && agents[agent]?.status !== 'working') { if (el) { el.remove(); drafts.delete(agent); } return; }
    const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160;
    if (!el) {
      el = document.createElement('div');
      el.className = 'msg draft';
      el.dataset.from = agent; paintMsg(el, agent);
      el.innerHTML = `<div class="av">${avatar(agent)}</div><div class="body"><div class="meta"><b>${esc(nameOf(agent))}</b>${TDOTS}<span class="dact"></span></div><div class="bubble"></div></div>`;
      $('#log').appendChild(el);
      drafts.set(agent, el);
    }
    el.hidden = !draftShown(agent);
    el.dataset.text = text ? '1' : '';
    el.querySelector('.dact').textContent = agents[agent]?.activity || (text ? 'typing…' : 'working…');
    el.querySelector('.bubble').innerHTML = text ? (md(text) || '<p></p>') : TDOTS;
    if (nearBottom) scroller.scrollTop = scroller.scrollHeight;
  }

  // ---------- server ----------
  async function api(url, body) {
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Crew': '1' },
      body: JSON.stringify(body || {}),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && j.error) alert(j.error);
    return { ...j, ok: r.ok && j.ok !== false };
  }

  async function load() {
    const r = await fetch('/api/state');
    if (r.status === 401) { location.reload(); return; }
    const s = await r.json();
    // Built-in pictures in /avatars: newer servers flag them; for older ones, check directly.
    await Promise.all(s.agents.filter((a) => a.avatar === undefined).map((a) =>
      fetch(`/avatars/${a.id}.png`).then((x) => { a.avatar = x.ok; }).catch(() => {})));
    userName = s.userName; if (window.paintCtl) window.paintCtl(!!s.computerControl); if (window.paintPause) window.paintPause(!!s.pausedAll);
    defaultAgent = s.defaultAgent;
    procs = s.procs || {};
    usage = s.usage;
    flags = s.flags || {};
    reactions = s.reactions || {};
    pins = s.pins || []; paintPins();
    asks = s.asks || [];
    schedules = s.schedules || [];
    modelChoices = s.modelChoices || [];
    pushKey = s.pushKey || '';
    if (s.signOutUrl) {
      $('#signOut').href = s.signOutUrl;
      $('#signOut').title = `Signed in as ${s.signedInAs}`;
      $('#signOut').hidden = false;
    }
    order = s.agents.map((a) => a.id);
    agents = Object.fromEntries(s.agents.map((a) => [a.id, a]));
    s.agents.forEach(renderAgent);
    $('#hint').textContent = `Goes to ${agents[defaultAgent].name} unless you @mention someone. @name sends to that agent, @all to everyone. A red ! on an agent means it's waiting on you.`;
    if (!s.history.length && !$('#log').children.length) {
      $('#log').innerHTML = '<div class="empty">Say hi to the crew. Your agents run Claude Code on this PC with your own login.</div>';
    }
    s.history.forEach(render);
    for (const [id, f] of Object.entries(flags)) { const x = msgs.get(id); if (x) { const box = x.el.querySelector('.extras') || x.el.querySelector('div[style]'); if (box) renderExtras(x.m, box); } }
    for (const [agent, text] of Object.entries(s.drafts || {})) renderDraft(agent, text);
    for (const a of s.agents) if (a.status === 'working' && !drafts.has(a.id)) renderDraft(a.id, '');
    renderUsage();
    if ($('#schedDlg').open) renderSchedules();
    scroller.scrollTop = scroller.scrollHeight;
    syncNotifyBtn();
  }

  function connect() {
    const es = new EventSource('/events');
    es.onopen = () => { $('#conn').className = 'on'; $('#conn').title = 'Connected'; load(); };
    es.onerror = () => { $('#conn').className = ''; $('#conn').title = 'Reconnecting…'; };
    es.addEventListener('agent', (e) => { const a = JSON.parse(e.data); if (a.avatar === undefined) a.avatar = agents[a.id]?.avatar; agents[a.id] = a; renderAgent(a); renderUsage();
      const d = drafts.get(a.id);
      if (!d) { if (a.status === 'working') renderDraft(a.id, ''); }
      else if (!d.dataset.text && a.status !== 'working') renderDraft(a.id, '');
      else d.querySelector('.dact').textContent = a.activity || (d.dataset.text ? 'typing…' : 'working…'); });
    es.addEventListener('procs', (e) => { procs = JSON.parse(e.data) || {}; Object.values(agents).forEach(renderAgent); });
    es.addEventListener('agentgone', (e) => { const { id } = JSON.parse(e.data); delete agents[id]; document.getElementById('agent-' + id)?.remove(); layoutAgents(); paintGroups(); });
    es.addEventListener('message', (e) => {
      const m = JSON.parse(e.data);
      render(m);
      if (document.hidden && !pushActive && m.from !== 'user' && (m.kind === 'chat' || m.kind === 'error')) notifyLocal(m);
    });
    es.addEventListener('unsent', (e) => { const { id } = JSON.parse(e.data); const x = msgs.get(id); if (x) { x.el.remove(); msgs.delete(id); } });
    es.addEventListener('draft', (e) => { const d = JSON.parse(e.data); renderDraft(d.agent, d.text); });
    es.addEventListener('usage', (e) => { usage = JSON.parse(e.data); renderUsage(); });
    es.addEventListener('control', (e) => { if (window.paintCtl) window.paintCtl(JSON.parse(e.data).on); });
    es.addEventListener('pauseall', (e) => { if (window.paintPause) window.paintPause(JSON.parse(e.data).paused); });
    es.addEventListener('pins', (e) => { pins = JSON.parse(e.data); paintPins(); });
    es.addEventListener('previews', (e) => {
      const next = JSON.parse(e.data) || [];
      const changed = JSON.stringify(next.map((p) => [p.id, p.status, p.ready, p.failed])) !== JSON.stringify(previews.map((p) => [p.id, p.status, p.ready, p.failed]));
      previews = next; paintPrevCount();
      if (changed && !prevLogs) renderPreviews();
    });
    es.addEventListener('asks', (e) => { asks = JSON.parse(e.data) || []; if (window.renderTray) window.renderTray(); });
    es.addEventListener('reactions', (e) => {
      const d = JSON.parse(e.data);
      if (d.list.length) reactions[d.id] = d.list; else delete reactions[d.id];
      const box = document.querySelector(`.reacts[data-rid="${d.id}"]`);
      if (box) paintReacts(box);
    });
    es.addEventListener('flags', (e) => {
      const d = JSON.parse(e.data);
      flags[d.id] = d.flags;
      const x = msgs.get(d.id);
      if (x) { const box = x.el.querySelector('.extras') || x.el.querySelector('div[style]'); if (box) renderExtras(x.m, box); }
    });
    es.addEventListener('schedules', (e) => { schedules = JSON.parse(e.data); if ($('#schedDlg').open) renderSchedules(); });
  }

  // ---------- machines ----------
  let machTimer = null;
  async function renderMachines() {
    const r = await fetch('/api/machines');
    if (!r.ok) return;
    const list = await r.json();
    const link = await fetch('/api/machines/link').then((x) => x.json()).catch(() => ({}));
    const rows = list.map((m) => `<div class="job" data-id="${esc(m.id)}">
        <div class="row"><b><span style="color:${m.online ? '#4caf50' : '#888'}">●</span> ${esc(m.name)}${m.hub ? ' <span class="small">(hub)</span>' : ''}</b>
          <span class="small grow">${m.online ? esc(m.activity || 'online') : 'offline · last seen ' + when(m.lastSeen)}</span>
          ${m.hub ? '' : '<button class="btn" data-del>Remove</button>'}</div>
        <div class="small">${esc(m.os || '')}${m.version ? ' · Crew ' + esc(m.version) : ''}</div></div>`).join('');

        <div class="small" id="machCode">Press the button, then enter the code in the "Connect to a hub" box on the other computer's Crew. Codes last 10 minutes and work once.</div></div>
      <div class="job"><div class="row"><b>Connect this PC to a hub</b></div>
        ${link.url ? `<div class="row"><span class="small grow">Connected to ${esc(link.url)}</span><button class="btn" id="machLeave">Disconnect</button></div>`
          : `<div class="small">On the hub's Machines panel press "Get pairing code", then enter its address and the code here.</div>
        <div class="row"><input id="machUrl" class="grow" placeholder="Hub address, e.g. crew.example.com" autocomplete="off">
          <input id="machIn" size="10" placeholder="Code" autocomplete="off" style="text-transform:uppercase">
          <button class="btn primary" id="machGo">Connect</button></div>
        <div class="small" id="machMsg"></div>`}</div>`;
    $('#machPair').onclick = async () => {
      const j = await api('/api/machines/pair');
      if (j.code) $('#machCode').innerHTML = `Pairing code: <b style="font-size:20px;letter-spacing:2px">${esc(j.code)}</b> (10 minutes, one use)`;

  // ---------- app previews (dev servers the crew runs, shown via /preview/<id>/) ----------
  let previews = [], prevSel = null, prevLogs = false;
  const prevViewed = new Set(); // previews whose "View" button was pressed this session
  function paintPrevCount() {
    const n = previews.filter((p) => p.status === 'running').length;
    $('#prevCount').textContent = n ? String(n) : '';
  }
  async function loadPreviews() {
    const r = await fetch('/api/previews');
    if (r.ok) { previews = await r.json(); paintPrevCount(); }
  }
  async function renderPreviews() {
    if (!$('#prevDlg').open) return;
    if (prevSel && !previews.some((p) => p.id === prevSel)) prevSel = null;
    if (!prevSel && previews.length) prevSel = (previews.find((p) => p.status === 'running') || previews[0]).id;
    const list = previews.map((p) => `<div class="job" data-id="${esc(p.id)}" style="${p.id === prevSel ? 'outline:1px solid var(--accent,#c96)' : ''}">
      <div class="row"><b><span style="color:${p.status === 'running' ? (p.ready ? '#4caf50' : p.failed ? '#e05050' : '#e0a030') : '#888'}">●</span> ${esc(p.name)}</b><span class="small grow">${p.agent ? '@' + esc(p.agent) + ' · ' : ''}port ${p.port}</span>
      <button class="btn" data-act="view">${p.status === 'running' && p.ready ? 'View' : 'Open'}</button>
      ${p.status === 'running' ? '<button class="btn" data-act="restart">Restart</button><button class="btn" data-act="stop">Stop</button>' : '<button class="btn primary" data-act="start">Start</button>'}
      <button class="btn" data-act="logs">Log</button></div></div>`).join('')
      || '<div class="small">Nothing yet. When an agent builds a web app it registers its dev server here, and you can watch it live.</div>';
    const sel = previews.find((p) => p.id === prevSel);
    let pane = '';
    if (sel && prevLogs) {
      const r = await fetch('/api/previews/logs?id=' + encodeURIComponent(sel.id) + '&n=200');
      const lines = r.ok ? (await r.json()).lines : [];
      pane = `<pre class="small" style="max-height:60vh;overflow:auto;white-space:pre-wrap">${esc(lines.join('\n') || '(no output yet)')}</pre>`;
    } else if (sel && sel.status === 'running' && !sel.ready && !sel.failed) {
      pane = `<div class="prev-wait"><div class="prev-dots"><i></i><i></i><i></i></div><div>Starting up ${esc(sel.name)}…</div><div class="small">It will be ready in a moment.</div></div>`;
    } else if (sel && (sel.failed || (sel.status === 'stopped' && sel.exit != null && sel.exit !== 0))) {
      pane = `<div class="prev-wait"><div>App didn't start.</div><div class="small">Open the log to see why.</div><button class="btn" id="prevSeeLog">See logs</button></div>`;
    } else if (sel && sel.status === 'running' && !prevViewed.has(sel.id)) {
      pane = `<div class="prev-wait"><div>${esc(sel.name)} is ready.</div><button class="btn primary" id="prevOpen">View</button></div>`;
    } else if (sel && sel.status === 'running') {
      pane = `<div class="row"><span class="small grow">${esc(sel.name)} · ${esc(sel.cwd)}</span><a class="btn" href="${esc(sel.url)}" target="_blank" rel="noopener">${ic('popout')} Full screen</a><button class="btn" id="prevReload" title="Reload">${ic('refresh')}</button></div>
        <iframe id="prevFrame" src="${esc(sel.url)}" style="width:100%;height:65vh;border:1px solid #444;border-radius:6px;background:#fff"></iframe>`;
    }
    $('#prevBody').innerHTML = list + pane;
    const po = $('#prevOpen'); if (po) po.onclick = () => { prevViewed.add(prevSel); renderPreviews(); };
    const ps = $('#prevSeeLog'); if (ps) ps.onclick = () => { prevLogs = true; renderPreviews(); };
    $('#prevBody').querySelectorAll('[data-act]').forEach((b) => {
      b.onclick = async () => {
        const id = b.closest('.job').dataset.id, act = b.dataset.act;
        if (act === 'view' || act === 'logs') { prevSel = id; prevLogs = act === 'logs'; return renderPreviews(); }
        b.disabled = true;
        prevViewed.delete(id);
        await api('/api/previews/' + act, { id });
        await loadPreviews(); prevSel = id; prevLogs = false; renderPreviews();
      };
    });
    const rl = $('#prevReload'); if (rl) rl.onclick = () => { const f = $('#prevFrame'); f.src = f.src; };
  }
  $('#prevBtn').onclick = async () => { await loadPreviews(); prevLogs = false; open('#prevDlg'); renderPreviews(); };
  loadPreviews();

  // ---------- integrations ----------

      <div class="small">Can use it: <b>${who(m.agents)}</b></div><div class="small" style="word-break:break-all">${esc(m.target)}</div></div>`).join('')

    ['palette', 'Leonardo AI', 'image generation (consistent icon and art styles)', 'an API key from your Leonardo account, which agent should use it, and a style prompt'],
    ['home', 'Home Assistant', 'smart-home control', 'your HA address, a long-lived access token and which agent gets it'],
    ['send', 'Telegram bot', 'messages and images to your phone', 'a bot token from @BotFather and your chat id'],
    ['code', 'GitHub', 'repos, pull requests and issues', 'a personal access token with the scopes you choose'],
    ['volume', 'ElevenLabs / voice', 'text to speech', 'an API key'],

    $('#intBack').onclick = () => renderIntegrations(false);

      el.onclick = async () => {

  // ---------- internet access (Cloudflare) guided setup ----------
  async function renderCloudflare(msg) {

    const step = (n, title, html, open) => `<details class="job" ${open ? 'open' : ''}><summary><b>Step ${n}. ${title}</b></summary><div class="small" style="margin-top:6px;line-height:1.5">${html}</div></details>`;

    box.innerHTML = `
      <div class="small">Lets you open Crew from your phone anywhere, safely: Cloudflare asks for a sign-in first, and Crew checks that sign-in again itself. Nothing is opened on your router. It is free for a few people. You need a Cloudflare account and a web address (domain) on it.</div>
      <div class="job"><h5>Where it stands</h5>
        ${tick(d.cloudflaredInstalled, 'Tunnel program (cloudflared) ' + (d.cloudflaredInstalled ? 'installed, ' + esc(d.tunnelService) : 'not installed yet'))}

      ${step(2, 'Create the tunnel', `The tunnel is the small program that connects this PC to Cloudflare. Open ${ext('https://one.dash.cloudflare.com/', 'Zero Trust')}. The first time it asks for a <b>team name</b> (anything, for example your surname) and the <b>Free</b> plan (it may ask for a card but charges nothing). Write the team name down: step 4 needs it.<br>1. Go to <b>Networks &gt; Tunnels &gt; Create a tunnel</b> (older menus: Access &gt; Tunnels).<br>2. Choose <b>Cloudflared</b>, then Next. Name it <code>Crew</code> and save.<br>3. Under <b>Choose your environment</b> pick <b>Windows</b>. It shows a command beginning <code>cloudflared.exe service install</code>. Copy the whole command.<br>4. On this PC press the Windows key, type <b>PowerShell</b>, right-click <b>Windows PowerShell</b> and choose <b>Run as administrator</b>. Paste the command and press Enter. That installs the tunnel and keeps it running after restarts.<br>5. Back in the browser, wait for the connector to show <b>Connected</b> (and the tunnel <b>Healthy</b>), then press <b>Next</b>.<br>6. On <b>Add a public hostname</b>: Subdomain <code>crew</code>, Domain = your domain, Path empty, Service type <b>HTTP</b>, URL <code>localhost:${esc(v.port)}</code>. Save the tunnel. Your Crew address is then <code>crew.yourdomain.com</code>.<br><b>Never</b> use port ${esc(d.mainPort)} here, only ${esc(v.port)}: that other port has no sign-in check.`, false)}
      ${step(3, 'Protect it with a sign-in', `Without this step anyone who finds the address could reach Crew, so do not skip it. In Zero Trust go to <b>Access &gt; Applications &gt; Add an application &gt; Self-hosted</b> (older menus: Access &gt; Applications).<br>1. Application name: <code>Crew</code>. Add a public hostname with the same subdomain and domain as step 2 (for example <code>crew</code> and <code>yourdomain.com</code>).<br>2. Add a policy: name <code>Me</code>, action <b>Allow</b>, and under Include choose selector <b>Emails</b> and type your own email address (add each person you want to let in). Under Login methods keep <b>One-time PIN</b> on; that is how Cloudflare emails you a code.<br>3. Save the application, then open it again (Access &gt; Applications &gt; Crew &gt; Edit) and copy its <b>Application Audience (AUD) Tag</b>, a long string of letters and numbers, from the Overview or Basic information section.`, false)}
      ${step(4, 'Tell Crew', 'Fill in the boxes below with what you just made, press <b>Check</b>, and when it looks right press <b>Save</b>, then restart Crew.', true)}
      <div class="job"><h5>Public address</h5><input id="cfHost" ${inp} value="${esc(v.hostname)}" placeholder="crew.yourdomain.com" autocapitalize="none"><div class="small">The address you gave the tunnel in step 2.</div></div>
      <div class="job"><h5>Team name</h5><input id="cfTeam" ${inp} value="${esc(v.teamDomain)}" placeholder="myteam.cloudflareaccess.com" autocapitalize="none"><div class="small">The team name you picked in step 2. If you forgot it, open Zero Trust &gt; Settings &gt; Custom Pages: it shows <b>yourteam.cloudflareaccess.com</b>. Just the first word is fine.</div></div>
      <div class="job"><h5>Application Audience (AUD) tag</h5><input id="cfAud" ${inp} value="${esc(v.aud)}" placeholder="long string of letters and numbers" autocapitalize="none" spellcheck="false"><div class="small">The long tag you copied at the end of step 3. Crew uses it to make sure a sign-in was meant for this app.</div></div>

    const read = () => ({ enabled: $('#cfOn').checked, hostname: $('#cfHost').value, teamDomain: $('#cfTeam').value, aud: $('#cfAud').value, allowedEmails: $('#cfMail').value, port: $('#cfPort').value });

      trimFile: { icon: 'scissors', l: 'Trim a long file into an archive', f: [{ k: 'file', t: 'text', l: 'file' }, { k: 'over', t: 'num', l: 'when over (lines)' }, { k: 'keep', t: 'num', l: 'keep newest' }, { k: 'archive', t: 'text', l: 'archive file' }] },
    },
  };
  const AB_DEF = { wait: { for: '2m' }, waitUntil: { cond: { type: 'agentIdle', agent: '' }, timeout: '30m', every: '30s' }, stopIf: { cond: { type: 'agentIdle', agent: '' } }, wake: { agent: '', model: 'sonnet', brief: '' }, verifyPaths: { text: '{{line}}' }, textMatches: { text: '{{line}}', re: '' }, processCount: { name: 'Game.exe', op: '>', n: 1 }, control: { on: true }, handoffSentRecently: { within: '20m' } };
  const LANES = [['when', 'WHEN', 'Something happens (any of these)'], ['cond', 'ONLY IF', 'Optional checks, all must pass'], ['then', 'THEN', 'Do these, top to bottom']];
  let abRule = null, abFocus = null, abIsNew = false, abList = [];

  const hx = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'cls') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== undefined && v !== false) e.setAttribute(k, v === true ? '' : v);

  const pget = (o, k) => k.split('.').reduce((x, p) => (x == null ? undefined : x[p]), o);

  function abField(obj, f) {

  // A check with a NOT switch. get/set work on the stored object, which may be {type:'not', cond}.
  function abCondEd(get, set, withPicker) {

      box.innerHTML = '';

      const neg = c.type === 'not';
      const inner = neg ? c.cond || {} : c;
      const meta = AB.cond[inner.type];
      if (!meta) { box.append(abJson(c, set, 'Combined check (edit as text)')); return; }
      const not = hx('input', { type: 'checkbox', onchange: () => { set(not.checked ? { type: 'not', cond: inner } : inner); paint(); } }); not.checked = neg;
      const head = hx('div', { cls: 'row' });
      if (withPicker) {

          Object.entries(AB.cond).map(([k, m]) => hx('option', { value: k }, m.l)));
        sel.value = inner.type; head.append(sel);
      }
      head.append(hx('label', { cls: 'ab-not', title: 'Flip it: pass only when this is NOT true' }, not, 'NOT'));
      box.append(head, hx('div', { cls: 'ab-fields' }, meta.f.map((f) => abField(inner, f))));

  }
  function abJson(obj, set, label) {

    t.value = JSON.stringify(obj, null, 1);

  }

  function abBlock(lane, i) {

    const neg = lane === 'cond' && obj.type === 'not';
    const meta = AB[lane][neg ? obj.cond?.type : obj.type];
    const blk = hx('div', { cls: `ab-blk ab-${lane}` });
    const handle = hx('span', { cls: 'ab-h', title: 'Drag to reorder' }, '⠿');
    handle.onmousedown = () => { blk.draggable = true; };
    handle.onmouseup = () => { blk.draggable = false; };
    blk.ondragstart = (e) => { e.dataTransfer.setData('application/x-ab', JSON.stringify({ move: lane, i })); e.dataTransfer.effectAllowed = 'move'; blk.classList.add('dragging'); };
    blk.ondragend = () => { blk.draggable = false; blk.classList.remove('dragging'); };
    const mv = (d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; abPaint(); };
    blk.append(hx('div', { cls: 'ab-bh' }, handle, hx('b', {}, meta ? [icn(meta.icon), ' ' + meta.l] : obj.type), hx('span', { cls: 'grow' }),
      hx('button', { cls: 'ab-ib', title: 'Move up', onclick: () => mv(-1) }, icn('chevUp')), hx('button', { cls: 'ab-ib', title: 'Move down', onclick: () => mv(1) }, icn('chevDown')),
      hx('button', { cls: 'ab-ib', title: 'Remove', onclick: () => { arr.splice(i, 1); abPaint(); } }, '×')));
    if (lane === 'cond') blk.append(abCondEd(() => arr[i], (c) => { arr[i] = c; }, false));
    else if (!meta) blk.append(abJson(obj, (j) => { arr[i] = j; }, 'Unknown block (edit as text)'));
    else if (meta.f.length) blk.append(hx('div', { cls: 'ab-fields' }, meta.f.map((f) => abField(obj, f))));
    return blk;
  }

  function abAdd(lane, type, at) {

      r.querySelectorAll('[data-o]').forEach((b) => { b.onclick = () => answer(k.options[+b.dataset.o]); });
      r.querySelector('[data-send]').onclick = sendTyped;
      inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); sendTyped(); } };
      r.querySelector('[data-j]').onclick = () => jump(k.agent, k.msgId);
      r.querySelector('[data-x]').onclick = () => api('/api/ask/dismiss', { id: k.id });
      body.appendChild(r);
    });
    body.scrollTop = prevScroll;
    if (focusId) { const i = t.querySelector(`input[data-ans="${CSS.escape(focusId)}"]`); if (i) { i.focus(); try { i.setSelectionRange(caret[0], caret[1]); } catch {} } }
  }
  window.renderTray = renderTray;
  const paintCtl = (on) => { const b = $('#ctlBtn'); b.innerHTML = ic('mouse') + (on ? ' Control: ON' : ' Control: OFF'); b.style.background = on ? '#c60' : ''; b.style.color = on ? '#fff' : ''; b.dataset.on = on ? '1' : ''; };
  $('#ctlBtn').onclick = async () => { const on = !$('#ctlBtn').dataset.on; if (on && !confirm('Give the crew full control of the mouse, keyboard and game?')) return;
    const stopsOnOff = (id) => { try { return !!CREW_LOCAL.stop.match && new RegExp(CREW_LOCAL.stop.match, 'i').test(id) && !CREW_LOCAL.stop.except.includes(id); } catch { return false; } };
    if (!on) { const w = Object.entries(agents).filter(([id, a]) => stopsOnOff(id) && a.status === 'working').map(([id, a]) => a.name || id); if (w.length && !confirm('Turning control OFF will stop ' + w.join(', ') + ' and close the game. Turn it off anyway?')) return; } paintCtl(on); await fetch('/api/control', { method: 'POST', headers: { 'X-Crew': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ on }) }); };
  $('#stopAllBtn').onclick = async () => { await fetch('/api/stopall', { method: 'POST', headers: { 'X-Crew': '1', 'Content-Type': 'application/json' }, body: '{}' }); };
  window.paintCtl = paintCtl;
  const paintPause = (on) => { const b = $('#pauseAllBtn'); b.innerHTML = on ? ic('play') + ' Resume' : ic('pause') + ' Pause all'; b.style.background = on ? '#c90' : ''; b.style.color = on ? '#000' : ''; b.dataset.on = on ? '1' : ''; };
  $('#pauseAllBtn').onclick = async () => { const paused = !$('#pauseAllBtn').dataset.on; paintPause(paused); await fetch('/api/pauseall', { method: 'POST', headers: { 'X-Crew': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ paused }) }); };
  window.paintPause = paintPause;
  $('#moreBtn').onclick = (e) => { e.stopPropagation(); document.body.classList.toggle('hmenu'); };
  $('#hscrim').onclick = () => document.body.classList.remove('hmenu');
  document.querySelectorAll('#hmore button.hbtn').forEach((b) => b.addEventListener('click', () => document.body.classList.remove('hmenu')));
  document.addEventListener('click', (e) => { if (!e.target.closest('#hmore') && !e.target.closest('#themeBtn')) document.body.classList.remove('hmenu'); });
  $('#allBtn').onclick = () => { grpMode = false; selectAgent(''); };
  $('#grpBtn').onclick = () => { grpMode = !grpMode; if (!grpMode && selIds().length > 1) selectAgent(selIds()[0]); applyFilter(); };
  $('#selPop').onclick = () => window.open(location.pathname + '?chat=' + encodeURIComponent(sel), '_blank', 'popup=yes,width=480,height=760');
  if (POP != null) document.body.classList.add('popout');
  $('#selAll').onclick = () => selectAgent('');
  $('#selMention').onclick = () => mention(sel);
  $('#menuBtn').onclick = () => document.body.classList.toggle('drawer');
  $('#scrim').onclick = () => document.body.classList.remove('drawer');
  new MutationObserver(renderTray).observe($('#agents'), { subtree: true, attributes: true, attributeFilter: ['class'] });
  setInterval(renderTray, 4000);
  setTimeout(() => { renderTray(); applyFilter(); }, 1200);
  setTimeout(() => { live = true; }, 3000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') applyFilter(); });
  setActivity(store.get('crew-activity') === '1');
  connect();

  // ---------- update notice ----------
  async function checkUpdate() {
    try {
      const u = await (await fetch('/api/update')).json();
      $('#ver').textContent = 'v' + u.current;
      const b = $('#updBtn');
      b.hidden = !(u.available && u.canApply);
      b.innerHTML = ic('arrowUp') + ` Update available (v${u.latest})`;
      b.title = `You have v${u.current}. Click to update to v${u.latest}.`;
    } catch { /* offline: no notice */ }
  }
  $('#updBtn').onclick = async () => {
    const b = $('#updBtn');
    if (!confirm('Update Claude Crew now? Your config, chats and workspace folders are kept. Running agents are stopped.')) return;
    b.disabled = true; b.textContent = 'Updating…';
    const r = await api('/api/update/apply');
    if (!r.ok) { b.disabled = false; checkUpdate(); if (!r.error) alert('Update failed.'); else if (r.error) alert(`Update failed: ${r.error}`); return; }
    if (!r.restarting) { b.hidden = true; alert(`Updated to v${r.version}. Restart Crew to use it: press Ctrl+C in the terminal and run npm start again, or use the tray icon's Restart Crew.`); return; }
    b.textContent = 'Restarting…';
    for (let i = 0; i < 40; i++) { // wait for the server to come back
      await new Promise((ok) => setTimeout(ok, 1500));
      try { if ((await fetch('/api/update')).ok) return location.reload(); } catch { /* still down */ }
    }
    alert('Updated. Crew did not come back by itself; restart it.');
  };
  checkUpdate();
  setInterval(checkUpdate, 30 * 60 * 1000);
})();
</script>
<style>
  #tourVeil { position: fixed; inset: 0; z-index: 200; display: none; }
  body.touring #tourVeil { display: block; }

  #tourCard { position: fixed; z-index: 201; width: min(340px, calc(100vw - 24px)); box-sizing: border-box; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  #tourCard h3 { margin: 0 0 6px; font-size: 17px; }
  #tourCard p { margin: 0 0 14px; font-size: 14px; line-height: 1.45; }
  #tourCard .tfoot { display: flex; gap: 8px; align-items: center; }
  #tourCard .tdot { font-size: 12px; color: var(--muted); flex: 1; }
  #tourCard .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }

<div id="tourVeil"><div id="tourHole" class="none"></div><div id="tourCard" role="dialog" aria-label="Crew tour"></div></div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} fetch('/api/prefs', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Crew': '1' }, body: JSON.stringify({ key: k, value: String(v) }) }).catch(() => {}); },
  };
  const narrow = () => matchMedia('(max-width: 800px)').matches;
  const visible = (e) => !!e && e.getClientRects().length > 0;
  const drawer = (on) => document.body.classList.toggle('drawer', on);
  const menu = (on) => { if (visible($('#moreBtn'))) document.body.classList.toggle('hmenu', on); };
  const steps = [
    { title: 'Welcome to Crew', text: 'Crew is a team of helpers you chat with. This quick tour shows the main places. It takes about a minute.' },
    { sel: '#agents', prep: () => { if (narrow()) drawer(true); }, title: 'Your crew', text: 'Each card is one helper. Tap a card to see only its chat, open its details, or stop it. A coloured dot shows who is busy.' },
    { sel: '#newAgBtn', prep: () => { if (narrow()) drawer(true); }, title: 'Add a helper', text: 'Create a new helper here: give it a name, a job and a folder to work in.' },
    { sel: '#scroller', prep: () => { drawer(false); }, title: 'The chat', text: 'Everything the crew says and does shows up here, in one shared conversation. Helpers can hand work to each other.' },
    { sel: '#input', prep: () => { drawer(false); }, title: 'Talk to the crew', text: 'Type what you want. Start with @name to speak to one helper, or just write and the coordinator picks who does it. Start with ! to make it urgent.' },
    { sel: '#sendBtn', title: 'Send', text: 'Press Send (or Enter) to post. The paperclip attaches photos and files.' },
    { sel: '#usageBtn', prep: () => { menu(false); }, title: 'Plan usage', text: 'These bars show how much of your Claude plan is used over the last 5 hours and the week. Tap them for details and a safety limit that holds new work when usage runs high.' },
    { sel: '#stopAllBtn', prep: () => { menu(false); }, title: 'Pause and stop', text: 'Pause all freezes everyone in place. Stop all ends every running task. Handy if something goes wrong.' },
    { sel: () => (visible($('#moreBtn')) ? $('#hmore') : $('#moreBtn')), prep: () => { setTimeout(() => menu(true), 30); }, /* after the page's click-outside handler has run */ title: 'The menu', text: 'Everything else lives here: live previews of apps the crew builds, what is blocked and waiting on you, automations, schedules, saved logins, themes and notifications.' },
    { title: 'You are set', text: 'Say hello to the crew in the message box to get started. You can replay this tour any time from the menu.' },
  ];
  let i = 0, on = false;
  const hole = () => $('#tourHole'), card = () => $('#tourCard');
  function close(done) {
    on = false; document.body.classList.remove('touring'); drawer(false); menu(false);
    if (done) store.set('crew-tour', 'done');
  }
  function place(el) {
    const h = hole(), c = card();
    const cw = c.offsetWidth, ch = c.offsetHeight;
    if (!el || !visible(el)) {
      h.className = 'none'; h.style.cssText = 'left:50%;top:50%;width:0;height:0';
      c.style.left = Math.max(12, (innerWidth - cw) / 2) + 'px'; c.style.top = Math.max(12, (innerHeight - ch) / 3) + 'px'; return;
    }
    const r = el.getBoundingClientRect(), p = 6;
    h.className = ''; h.style.left = (r.left - p) + 'px'; h.style.top = (r.top - p) + 'px'; h.style.width = (r.width + 2 * p) + 'px'; h.style.height = (r.height + 2 * p) + 'px';
    let top = r.bottom + 14 + ch < innerHeight ? r.bottom + 14 : r.top - ch - 14;
    let left = Math.min(Math.max(12, r.left), innerWidth - cw - 12);
    if (top < 12 || (r.width > innerWidth * 0.5 && r.height > innerHeight * 0.4)) { // big target: card floats at the bottom of it
      top = Math.max(12, Math.min(innerHeight - ch - 12, r.bottom - ch - 16)); left = Math.max(12, Math.min(innerWidth - cw - 12, r.right - cw - 16));
      if (r.width > innerWidth * 0.5) left = Math.max(12, (innerWidth - cw) / 2);
    }
    c.style.left = left + 'px'; c.style.top = top + 'px';
  }
  function show() {
    const s = steps[i], last = i === steps.length - 1, first = i === 0;
    if (s.prep) s.prep();
    card().innerHTML = `<h3>${s.title}</h3><p>${s.text}</p><div class="tfoot"><span class="tdot">${first || last ? '' : i + ' of ' + (steps.length - 2)}</span>`
      + (first ? '<button class="btn" data-t="skip">Skip</button><button class="btn primary" data-t="next">Take the tour</button>'
        : last ? '<button class="btn primary" data-t="end">Done</button>'
        : '<button class="btn" data-t="skip">Skip</button><button class="btn" data-t="back">Back</button><button class="btn primary" data-t="next">Next</button>') + '</div>';
    place(null);
    setTimeout(() => {
      if (!on) return;
      const el = typeof s.sel === 'function' ? s.sel() : s.sel ? document.querySelector(s.sel) : null;
      place(el);
    }, 320);
  }
  function start() { i = 0; on = true; document.body.classList.add('touring'); show(); }
  card().addEventListener('click', (e) => {
    const t = e.target.closest('[data-t]'); if (!t) return;
    const a = t.dataset.t;
    if (a === 'skip' || a === 'end') close(true);
    else if (a === 'next') { i++; show(); }
    else if (a === 'back') { i = Math.max(0, i - 1); show(); }
  });
  document.addEventListener('keydown', (e) => {
    if (!on) return;
    if (e.key === 'Escape') close(true);
    else if (e.key === 'ArrowRight') { if (i < steps.length - 1) { i++; show(); } else close(true); }
    else if (e.key === 'ArrowLeft') { i = Math.max(0, i - 1); show(); }
  });
  addEventListener('resize', () => { if (on) show(); });
  const tb = $('#tourBtn');
  if (tb) tb.onclick = () => { document.body.classList.remove('hmenu'); setTimeout(start, 50); };
  if (!store.get('crew-tour') && !document.body.classList.contains('popout')) setTimeout(() => { if (!store.get('crew-tour')) start(); }, 900);
})();

// ---------- in-app picture viewer ----------
// Pictures open on top of Crew (never a new page), so there is always a way back to the same spot.
(() => {
  const v = document.createElement('div');
  v.id = 'picView'; v.hidden = true;
  v.innerHTML = '<button id="picClose" type="button" aria-label="Close picture">&times;</button><img alt="" draggable="false">';
  document.body.appendChild(v);
  const img = v.querySelector('img'), xb = v.querySelector('#picClose');
  let open = false, pushed = false, sc = 1, tx = 0, ty = 0;
  const pts = new Map();
  let pinch = null, drag = null, moved = 0, downOnImg = false;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; v.classList.toggle('zoomed', sc > 1); };
  const reset = () => { sc = 1; tx = ty = 0; apply(); };
  const clampPan = () => {
    const r = img.getBoundingClientRect(), w = v.clientWidth, h = v.clientHeight;
    const bw = r.width / sc, bh = r.height / sc; // base size at scale 1
    const mx = Math.max(0, (bw * sc - w) / 2), my = Math.max(0, (bh * sc - h) / 2);
    tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
  };
  const setScale = (s) => { sc = Math.min(6, Math.max(1, s)); if (sc === 1) { tx = ty = 0; } else clampPan(); apply(); };
  function hide() {
    if (!open) return;
    open = false; v.hidden = true; img.removeAttribute('src'); pts.clear(); pinch = drag = null; reset();
  }
  function show(src, alt) {
    reset(); img.alt = alt || ''; img.src = src; v.hidden = false; open = true;
    history.pushState({ crewPic: 1 }, ''); pushed = true; xb.focus({ preventScroll: true });
  }
  function closeUI() { if (!open) return; if (pushed) { pushed = false; history.back(); } else hide(); }
  addEventListener('popstate', () => { pushed = false; hide(); });
  document.addEventListener('keydown', (e) => {
    if (open && e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeUI(); }
  }, true);
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a.pic');
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    e.preventDefault();
    show(a.getAttribute('href'), a.querySelector('img')?.alt);
  });
  xb.addEventListener('click', (e) => { e.stopPropagation(); closeUI(); });
  xb.addEventListener('pointerdown', (e) => e.stopPropagation());
  v.addEventListener('wheel', (e) => { e.preventDefault(); setScale(sc * (e.deltaY < 0 ? 1.2 : 1 / 1.2)); }, { passive: false });
  v.addEventListener('pointerdown', (e) => {
    if (e.target === xb) return;
    v.setPointerCapture?.(e.pointerId);
    if (!pts.size) downOnImg = e.target === img;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = 0;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: sc }; drag = null; }
    else if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, tx, ty };
  });
  v.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      moved = 99; setScale(pinch.s * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    } else if (drag && pts.size === 1) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      moved = Math.max(moved, Math.hypot(dx, dy));
      if (sc > 1) { tx = drag.tx + dx; ty = drag.ty + dy; clampPan(); apply(); }
    }
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 1) { const [p] = [...pts.values()]; drag = { x: p.x, y: p.y, tx, ty }; moved = 99; return; }
    if (pts.size === 0) {
      drag = null;
      if (e.type === 'pointerup' && moved < 8) {
        if (downOnImg) setScale(sc > 1 ? 1 : 2.5); // tap picture: zoom in/out
        else closeUI(); // tap outside the picture: close
      }
    }
  };
  v.addEventListener('pointerup', up); v.addEventListener('pointercancel', up);
  v.addEventListener('contextmenu', (e) => e.preventDefault());
})();
</script>
