<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090c15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crew">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Claude Crew</title>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --panel-2: #f0eee6; --text: #1f1e1d; --muted: #6b6a65;
    --border: #e3e0d6; --accent: #c96442; --accent-text: #fff; --you: #c96442; --you-text: #fff;
    --ok: #4a8a5c; --warn: #b7822b; --err: #b3412f; --code: #f3f1ea;
    --add-bg: #e6f4ea; --add-fg: #1e6b34; --del-bg: #fbe9e7; --del-fg: #a3281b; --hunk: #3a6ea5;
    --scroll-thumb: #cfcbbf; --scroll-thumb-hover: #b3ae9f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bg: #1f1e1d; --panel: #262624; --panel-2: #30302d; --text: #ecebe6; --muted: #9c9a92;
      --border: #3a3936; --accent: #d97757; --you: #9c4a2f; --you-text: #fff;
      --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #1a1918;
      --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
      --scroll-thumb: #45433f; --scroll-thumb-hover: #5c5a55;
      color-scheme: dark;
    }
  }
  [data-theme="dark"] {
    --bg: #1f1e1d; --panel: #262624; --panel-2: #30302d; --text: #ecebe6; --muted: #9c9a92;
    --border: #3a3936; --accent: #d97757; --you: #9c4a2f; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #1a1918;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #45433f; --scroll-thumb-hover: #5c5a55;
    color-scheme: dark;
  }
  [data-theme="midnight"] {
    --bg: #0d1117; --panel: #161b22; --panel-2: #21262d; --text: #e6edf3; --muted: #8b949e;
    --border: #30363d; --accent: #58a6ff; --accent-text: #fff; --you: #1f6feb; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #010409;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #30363d; --scroll-thumb-hover: #484f58;
    color-scheme: dark;
  }
  [data-theme="forest"] {
    --bg: #1a211c; --panel: #222b24; --panel-2: #2c372e; --text: #e4ebe2; --muted: #93a394;
    --border: #38463b; --accent: #6fbf73; --accent-text: #fff; --you: #3f7a45; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #141a15;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #3a483d; --scroll-thumb-hover: #516353;
    color-scheme: dark;
  }
  [data-theme="ocean"] {
    --bg: #0f1c24; --panel: #16262f; --panel-2: #1e3340; --text: #e1eef5; --muted: #8fa9b8;
    --border: #2a4455; --accent: #3fb6d6; --accent-text: #fff; --you: #23809c; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #0a141a;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #2a4455; --scroll-thumb-hover: #3c6075;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #faf9f5; --panel: #ffffff; --panel-2: #f0eee6; --text: #1f1e1d; --muted: #6b6a65;
    --border: #e3e0d6; --accent: #c96442; --accent-text: #fff; --you: #c96442; --you-text: #fff;
    --ok: #4a8a5c; --warn: #b7822b; --err: #b3412f; --code: #f3f1ea;
    --add-bg: #e6f4ea; --add-fg: #1e6b34; --del-bg: #fbe9e7; --del-fg: #a3281b; --hunk: #3a6ea5;
    --scroll-thumb: #cfcbbf; --scroll-thumb-hover: #b3ae9f;
    color-scheme: light;
  }
  /* Neon Lights: black-violet night, hot magenta accent, cyan edge light, faint grid. */
  [data-theme="neon"] {
    --bg: #07050f; --panel: #0e0a1c; --panel-2: #181030; --text: #f3ecff; --muted: #9b8fc4;
    --border: #2b1f52; --accent: #ff2bd6; --accent-text: #19001a; --you: #5b2de0; --you-text: #fff;
    --ok: #3dffb0; --warn: #ffd23f; --err: #ff4d6d; --code: #05030b;
    --add-bg: #0b2a22; --add-fg: #5dffc0; --del-bg: #35101f; --del-fg: #ff8fa8; --hunk: #4de1ff;
    --scroll-thumb: #3a2a6e; --scroll-thumb-hover: #5a3fa8;
    color-scheme: dark;
  }
  /* Synthwave: deep purple, sun-orange accent, pink horizon glow. */
  [data-theme="synthwave"] {
    --bg: #1a0b2e; --panel: #241142; --panel-2: #2f1855; --text: #fff0fb; --muted: #b79ad6;
    --border: #44256f; --accent: #ffa23d; --accent-text: #2a1000; --you: #b0237f; --you-text: #fff;
    --ok: #6fe3b0; --warn: #ffd166; --err: #ff6b81; --code: #12071f;
    --add-bg: #12302a; --add-fg: #8fe8c0; --del-bg: #3a1424; --del-fg: #ff9fb0; --hunk: #8fc2ff;
    --scroll-thumb: #4a2a7a; --scroll-thumb-hover: #6a3fa8;
    color-scheme: dark;
  }
  /* Terminal: green phosphor on near-black, monospace. */
  [data-theme="terminal"] {
    --bg: #030a05; --panel: #07140b; --panel-2: #0c1e11; --text: #b8f5c6; --muted: #5f9d72;
    --border: #15361f; --accent: #3dff74; --accent-text: #02140a; --you: #0e6a30; --you-text: #d8ffe3;
    --ok: #3dff74; --warn: #e6d34a; --err: #ff6b5b; --code: #020703;
    --add-bg: #0a2a14; --add-fg: #7dffa0; --del-bg: #2e1410; --del-fg: #ff9d8a; --hunk: #6fd6ff;
    --scroll-thumb: #1b4a2a; --scroll-thumb-hover: #2a7040;
    color-scheme: dark;
  }
  /* Per-theme glow colours (r,g,b: a = secondary, b = accent, c = third) and background decoration.
     --deco is a list of full background layers shown behind the chat. */
  :root {
    --glow-a: 201,100,66; --glow-b: 201,100,66; --glow-c: 201,100,66;
    --deco: none; --you-grad: var(--you); --send-grad: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent));
    --head-edge: linear-gradient(90deg, transparent, rgba(var(--glow-b),.5) 18%, rgba(var(--glow-a),.4) 60%, transparent);
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-theme="space"] {
    --glow-a: 99,88,220; --glow-b: 240,141,94; --glow-c: 64,170,200;
    --you-grad: linear-gradient(135deg, #5a4fc9, #3f4aa8);
    --deco:
      radial-gradient(1px 1px at 23px 41px, rgba(255,255,255,.55), transparent 60%) 0 0/241px 251px,
      radial-gradient(1px 1px at 131px 97px, rgba(255,255,255,.35), transparent 60%) 0 0/241px 251px,
      radial-gradient(1.5px 1.5px at 77px 173px, rgba(200,215,255,.5), transparent 60%) 0 0/241px 251px,
      radial-gradient(1px 1px at 53px 239px, rgba(255,230,210,.4), transparent 60%) 0 0/337px 331px,
      radial-gradient(1.5px 1.5px at 311px 67px, rgba(255,255,255,.45), transparent 60%) 0 0/337px 331px,
      radial-gradient(1px 1px at 283px 263px, rgba(190,205,255,.35), transparent 60%) 0 0/337px 331px,
      radial-gradient(ellipse 55% 45% at 88% 8%, rgba(var(--glow-a),.10), transparent 70%) no-repeat,
      radial-gradient(ellipse 50% 40% at 6% 96%, rgba(var(--glow-c),.07), transparent 70%) no-repeat;
  }
  [data-theme="neon"] {
    --glow-a: 0,229,255; --glow-b: 255,43,214; --glow-c: 138,43,255;
    --you-grad: linear-gradient(135deg, #6a2cf5, #2a62f0);
    --send-grad: linear-gradient(135deg, #ff2bd6, #9a2bff);
    --head-edge: linear-gradient(90deg, rgba(var(--glow-b),0), rgba(var(--glow-b),.9) 20%, rgba(var(--glow-a),.9) 70%, rgba(var(--glow-a),0));
    --deco:
      linear-gradient(rgba(var(--glow-a),.06) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, rgba(var(--glow-a),.06) 1px, transparent 1px) 0 0/44px 44px,
      radial-gradient(ellipse 60% 45% at 90% 4%, rgba(var(--glow-b),.16), transparent 70%) no-repeat,
      radial-gradient(ellipse 55% 40% at 4% 98%, rgba(var(--glow-a),.12), transparent 70%) no-repeat;
  }
  [data-theme="synthwave"] {
    --glow-a: 255,110,199; --glow-b: 255,162,61; --glow-c: 138,80,255;
    --you-grad: linear-gradient(135deg, #c42a8d, #7b2cbf);
    --deco:
      radial-gradient(circle 120px at 50% 100%, rgba(255,162,61,.28), rgba(255,110,199,.14) 55%, transparent 72%) no-repeat,
      linear-gradient(rgba(var(--glow-a),.05) 1px, transparent 1px) 0 0/50px 50px,
      linear-gradient(90deg, rgba(var(--glow-a),.05) 1px, transparent 1px) 0 0/50px 50px,
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(var(--glow-c),.2), transparent 70%) no-repeat;
  }
  [data-theme="terminal"] {
    --glow-a: 61,255,116; --glow-b: 61,255,116; --glow-c: 61,255,116;
    --font-body: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --you-grad: linear-gradient(135deg, #0e6a30, #0a4d23);
    --send-grad: var(--accent);
    --deco:
      repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse 70% 60% at 50% 40%, rgba(var(--glow-b),.07), transparent 75%) no-repeat;
  }
  [data-theme="midnight"] {
    --glow-a: 31,111,235; --glow-b: 88,166,255; --glow-c: 137,87,229;
    --deco: radial-gradient(ellipse 55% 40% at 90% 4%, rgba(var(--glow-a),.14), transparent 70%) no-repeat, radial-gradient(ellipse 50% 40% at 4% 98%, rgba(var(--glow-c),.08), transparent 70%) no-repeat;
  }
  [data-theme="forest"] {
    --glow-a: 63,185,160; --glow-b: 111,191,115; --glow-c: 120,100,220;
    --deco: radial-gradient(ellipse 80% 30% at 20% 0%, rgba(var(--glow-b),.16), transparent 70%) no-repeat, radial-gradient(ellipse 70% 28% at 80% 6%, rgba(var(--glow-a),.14), transparent 70%) no-repeat, radial-gradient(ellipse 50% 30% at 60% 0%, rgba(var(--glow-c),.1), transparent 70%) no-repeat;
  }
  [data-theme="ocean"] {
    --glow-a: 63,182,214; --glow-b: 63,182,214; --glow-c: 40,120,200;
    --deco: radial-gradient(ellipse 90% 35% at 50% 110%, rgba(var(--glow-a),.16), transparent 70%) no-repeat, radial-gradient(ellipse 50% 30% at 85% 0%, rgba(var(--glow-c),.12), transparent 70%) no-repeat;
  }
  [data-theme="dark"] {
    --glow-a: 217,119,87; --glow-b: 217,119,87; --glow-c: 217,119,87;
    --deco: radial-gradient(ellipse 55% 35% at 92% 0%, rgba(var(--glow-b),.07), transparent 70%) no-repeat;
  }
  [data-theme="light"], [data-theme="slate"], [data-theme="sepia"] { --head-edge: linear-gradient(90deg, transparent, rgba(var(--glow-b),.3) 30%, transparent); }
  [data-theme="slate"] { --glow-a: 59,111,182; --glow-b: 59,111,182; --glow-c: 59,111,182; }
  [data-theme="sepia"] { --glow-a: 160,82,45; --glow-b: 160,82,45; --glow-c: 160,82,45; }
  [data-theme="slate"] {
    --bg: #e8ebef; --panel: #ffffff; --panel-2: #dde2e8; --text: #1d2530; --muted: #5f6b7a;
    --border: #ccd3dc; --accent: #3b6fb6; --accent-text: #fff; --you: #3b6fb6; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #eef1f5;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #bcc5d0; --scroll-thumb-hover: #a0abb8;
    color-scheme: light;
  }
  [data-theme="sepia"] {
    --bg: #f4ecd8; --panel: #fbf5e6; --panel-2: #eadfc4; --text: #3b3024; --muted: #7b6c55;
    --border: #d9ccaa; --accent: #a0522d; --accent-text: #fff; --you: #a0522d; --you-text: #fff;
    --ok: #6fb581; --warn: #d9a54a; --err: #e0705c; --code: #efe5cb;
    --add-bg: #17301f; --add-fg: #8fd6a3; --del-bg: #3a1c18; --del-fg: #f2a497; --hunk: #8ab4e8;
    --scroll-thumb: #cfc09a; --scroll-thumb-hover: #b8a87c;
    color-scheme: light;
  }
  /* Deep space (default): near-black navy, thruster-orange accent, violet for you. */
  [data-theme="space"] {
    --bg: #090c15; --panel: #10141f; --panel-2: #171c2b; --text: #e4e7f0; --muted: #8790a8;
    --border: #232a3d; --accent: #f08d5e; --accent-text: #1a0d06; --you: #4d47b8; --you-text: #f3f2ff;
    --ok: #5fc48a; --warn: #e3b04f; --err: #ef6b5b; --code: #070a11;
    --add-bg: #10291c; --add-fg: #8fe0aa; --del-bg: #33171a; --del-fg: #f5a59a; --hunk: #8fb2ff;
    --scroll-thumb: #283048; --scroll-thumb-hover: #3a4463;
    --glow-a: 99,88,220; --glow-b: 240,141,94; --glow-c: 64,170,200;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* Scrollbars: slim, theme-coloured thumb on a transparent track so they don't pull focus. */
  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; white-space: nowrap; }
  #logo { width: 26px; height: 26px; border-radius: 6px; flex: none; margin-right: -4px; }
  #conn { width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
  #conn.on { background: var(--ok); }
  header .spacer { flex: 1; }
  .hbtn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .hbtn.on { color: var(--text); border-color: var(--accent); }
  .hbtn[hidden] { display: none; }

  /* usage meter chip */
  #usageBtn { display: flex; align-items: center; gap: 10px; padding: 4px 10px; }
  .meter { display: grid; gap: 2px; min-width: 64px; text-align: left; }
  .meter[hidden] { display: none; }
  .meter .lbl { font-size: 10.5px; line-height: 1; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .bar { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }
  .bar.warn > i { background: var(--warn); }
  .bar.hot > i { background: var(--err); }
  .bar.big { height: 12px; border-radius: 6px; }

  #agents {
    display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--border); background: var(--panel); scrollbar-width: thin;
  }
  .agent {
    position: relative;
    flex: 0 0 auto; min-width: 150px; max-width: 230px; display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 8px; align-items: center;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2);
  }
  .agent[style*="--ac"] { border-color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, var(--panel-2)); }
  .agent.pinned::after { content: ''; position: absolute; left: -4px; top: -6px; width: 11px; height: 11px; background: var(--accent); -webkit-mask: var(--pin-mask) center / contain no-repeat; mask: var(--pin-mask) center / contain no-repeat; }
  :root { --pin-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9.5 2.5l4 4-1.8.9-1.9 1.9.3 2.3-.9.9-5.4-5.4.9-.9 2.3.3 1.9-1.9zM2.5 13.5l3.2-3.2'/></svg>"); }
  .ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
  i[data-ic] { display: inline-flex; font-style: normal; }
  .agent .tools button .ic { width: 13px; height: 13px; vertical-align: middle; }
  .agent.dragover { outline: 2px dashed var(--accent); }
  .agrp { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 6px 6px; border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); border-radius: 14px; background: color-mix(in srgb, var(--text) 2.5%, transparent); min-width: 0; }
  .agrp.collapsed { gap: 0; }
  .agrp.dragover { outline: 2px dashed var(--accent); }
  /* group header: one clean line. chevron, NAME, count, status pill, hover tools */
  .agrp-h { display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 2px 0 4px; font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none; border-radius: 8px; min-width: 0; }
  .agrp-h .chev { flex: none; width: 10px; height: 10px; display: grid; place-items: center; transition: transform .18s; }
  .agrp-h .chev::before { content: ''; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-1px) rotate(45deg); }
  .agrp.collapsed .agrp-h .chev { transform: rotate(-90deg); }
  .agrp-h .gn { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); opacity: .72; }
  .agrp-h .ct { flex: none; font-size: 10px; font-weight: 600; letter-spacing: 0; line-height: 16px; min-width: 16px; padding: 0 5px; box-sizing: border-box; text-align: center; border-radius: 8px; background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--muted); }
  .agrp-h .gs { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0; text-transform: none; white-space: nowrap; line-height: 18px; padding: 0 7px 0 5px; border-radius: 9px; color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .agrp-h .gs:empty { display: none; }
  .agrp-h .gs.need { color: var(--err); background: color-mix(in srgb, var(--err) 13%, transparent); padding-left: 7px; }
  .agrp-h .tb { flex: none; display: flex; gap: 1px; margin-left: auto; }
  .agrp-h .gs:not(:empty) + .tb { margin-left: 0; }
  .agrp-h button { width: 22px; height: 22px; padding: 0; display: grid; place-items: center; background: none; border: 0; border-radius: 6px; color: var(--muted); }
  .agrp-h button:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }

  .ab-then { border-left-color: #4f7fd6 !important; }
  .ab-lh { margin: 12px 0 4px; font-size: 13px; }
  .ab-lh:first-child { margin-top: 0; }
  .ab-lane { min-height: 44px; border: 2px dashed var(--border); border-radius: 10px; padding: 6px; display: grid; gap: 6px; transition: background .15s, border-color .15s; }
  .ab-lane.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .ab-lane.nope { border-color: var(--err); }
  .ab-empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 8px; }
  .ab-blk { border: 1px solid var(--border); border-left: 5px solid; border-radius: 9px; background: var(--panel-2); padding: 6px 8px; display: grid; gap: 6px; }
  .ab-blk.dragging { opacity: .4; }
  .ab-bh { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  .ab-h { cursor: grab; color: var(--muted); font-size: 16px; padding: 0 2px; user-select: none; }
  .ab-ib { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 2px 5px; cursor: pointer; }
  .ab-ib:hover { color: var(--text); }
  .ab-fields { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: flex-end; }
  .ab-fl { display: grid; gap: 2px; font-size: 11.5px; color: var(--muted); }
  .ab-fl.ab-wide { flex-basis: 100%; }
  .ab-fl.ab-chk { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text); }
  .ab-fl input[type=text], .ab-fl input:not([type]), #abBody > .row input { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 5px 7px; min-width: 150px; }
  .ab-fl input.ab-short, .ab-fl input[type=number] { min-width: 0; width: 72px; }
  .ab-fl textarea { min-height: 54px; }
  .ab-mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  textarea.bad { border-color: var(--err) !important; }
  .ab-cond { display: grid; gap: 6px; }
  .ab-blk .ab-cond { border: 0; }
  .ab-blk .ab-fields .ab-cond { flex-basis: 100%; padding: 6px; border: 1px dashed var(--border); border-radius: 8px; }
  .ab-not { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .ab-vars { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 10px; }
  .ab-var { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--code); border: 1px solid var(--border); cursor: grab; }
  .ab-lim { margin-top: 14px; font-size: 13px; }
  .ab-lim summary { cursor: pointer; color: var(--muted); margin-bottom: 6px; }
  .anew { justify-self: start; }
  @media (max-width: 720px) { .ab-grid { grid-template-columns: 1fr; } .ab-pal { position: static; max-height: 210px; } }
  #autoBody .agrp-h { font-size: 12px; color: var(--muted); margin: 14px 0 2px; letter-spacing: .05em; cursor: default; min-height: 0; padding: 0; }
  .arun { font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .arun .bad { color: var(--err); }
  @media (max-width: 800px) {
    header { position: relative; flex-wrap: nowrap; }
    header h1 { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    header h1 small { display: none; }
  }

  /* ---- sidebar layout (Grok-style) ---- */
  #shell { flex: 1; min-height: 0; display: flex; }
  #chatcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #scroller { flex: 1; min-height: 0; }
  #menuBtn { display: none; }
  #selBar { display: none; align-items: center; gap: 8px; padding: 6px 16px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 13px; }
  #selBar.on { display: flex; }
  #selBar .grow { flex: 1; font-weight: 600; }
  #tray { display: none; gap: 6px; padding: 6px 12px; flex-direction: column; border-bottom: 1px solid var(--err); background: color-mix(in srgb, var(--err) 10%, var(--panel)); }
  #tray.on { display: flex; }
  #tray { padding-top: 4px; padding-bottom: 4px; }
  #tray .tbody { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow-y: auto; }
  #tray .tbar { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  #tray .tbar .tn { font-weight: 700; white-space: nowrap; }
  #tray .tbar .tl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  #tray .tbar:focus-visible { outline: 3px solid var(--accent, #6aa0ff); outline-offset: 2px; }
  #tray .ansrow { flex-wrap: nowrap; }
  #tray .ansrow input { flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 8px 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg, var(--panel)); color: var(--text); }
  #tray .ansrow button { flex: 0 0 auto; }
  details.denynote > summary { cursor: pointer; font-weight: 600; font-size: 13px; opacity: .85; }
  #tray .tr { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  #tray .tr.perm { border-left: 4px solid #e0a020; }
  #tray .tr.ask { border-left: 4px solid var(--accent, #6aa0ff); }
  #tray .tk { font-size: 12px; font-weight: 600; opacity: .85; }
  #tray .tq { font-size: 15px; line-height: 1.35; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  #tray .tb { display: flex; flex-wrap: wrap; gap: 8px; }
  #tray .tr button { min-height: 44px; padding: 8px 16px; font-size: 15px; font-weight: 600; border-radius: 10px; border: 1px solid var(--border); background: var(--bg, var(--panel)); color: var(--text); cursor: pointer; flex: 1 1 auto; }
  #tray .tr button.opt { border-color: var(--accent, #6aa0ff); }
  #tray .tr button.allow { background: #1f7a3a; color: #fff; border-color: #1f7a3a; }
  #tray .tr button.deny { background: #9b2226; color: #fff; border-color: #9b2226; }
  #tray .tb.sub button, #tray .tr button.ghost { flex: 0 1 auto; min-height: 44px; font-size: 14px; font-weight: 500; background: transparent; }
  #tray .tr button:focus-visible { outline: 3px solid var(--accent, #6aa0ff); outline-offset: 2px; }
  #tray .tr button:disabled { opacity: .5; cursor: default; }
  #newAgBtn { flex: none; }
  #allBtn { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel-2); font-weight: 600; flex: none; }
  #grpBtn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .agent .unread { position: absolute; right: 8px; top: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--accent); color: var(--accent-text); font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
  body.popout header, body.popout #agents, body.popout #scrim { display: none !important; }
  body.popout #selAll, body.popout #selPop { display: none; }
  #allBtn.sel, .agent.sel { outline: 2px solid var(--accent); }
  @media (min-width: 801px) {
    #agents { flex-direction: column; width: 250px; flex: none; overflow-y: auto; overflow-x: hidden; border-bottom: 0; border-right: 1px solid var(--border); padding: 10px; }
    #agents .agent { max-width: none; width: 100%; box-sizing: border-box; }
    #agents .agrp { align-self: stretch; }
    #agents .agrp-b { flex-direction: column; }
  }
  @media (max-width: 800px) {
    #menuBtn { display: inline-block; }
    #agents { position: fixed; z-index: 50; top: 0; bottom: 0; left: 0; width: min(86vw, 320px); flex-direction: column; overflow-y: auto; overflow-x: hidden;
      padding: calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom)); border: 0; border-right: 1px solid var(--border);
      transform: translateX(-102%); transition: transform .22s; box-shadow: 4px 0 24px rgba(0,0,0,.35); }
    body.drawer #agents { transform: none; }
    #agents .agent { max-width: none; min-height: 52px; }
    #agents .agrp.slim .agent { min-height: 36px; }
    #agents .agrp.slim.tiny .agent { min-height: 28px; }
    #agents .agrp-b { flex-direction: column; }
    #scrim { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); }
    body.drawer #scrim { display: block; }
    #input { font-size: 16px; }
    .ibtn, #sendBtn { min-height: 44px; }
  }

  /* ---- Theme dressing: one layer driven by each theme's variables (glow colours, --deco, gradients). ---- */
  body { font-family: var(--font-body); }
  #scroller { background: var(--deco), var(--bg); }
  header {
    background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 82%, var(--bg)), var(--panel));
    border-bottom: 1px solid transparent; border-image: var(--head-edge) 1;
  }
  header h1 { letter-spacing: .02em; font-weight: 600; }
  #logo { filter: drop-shadow(0 0 6px rgba(var(--glow-b),.35)); }
  #agents { background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 80%, var(--bg)), color-mix(in srgb, var(--bg) 85%, var(--panel))); }
  footer { background: linear-gradient(0deg, color-mix(in srgb, var(--bg) 85%, var(--panel)), color-mix(in srgb, var(--panel) 92%, transparent)); }
  :root .agent { background: color-mix(in srgb, var(--panel-2) 85%, transparent); transition: border-color .15s, background .15s, box-shadow .15s; }
  :root .agent:hover { border-color: color-mix(in srgb, var(--border) 60%, var(--accent)); box-shadow: 0 0 14px -6px rgba(var(--glow-b),.6); }
  :root .msg .bubble { background: color-mix(in srgb, var(--panel) 88%, transparent); box-shadow: 0 6px 18px -12px rgba(0,0,0,.6); }
  :root .msg.you .bubble { background: var(--you-grad); box-shadow: 0 6px 20px -10px rgba(var(--glow-a),.7); }
  :root .msg[style*="--ac"] .bubble { background: color-mix(in srgb, var(--ac) 9%, color-mix(in srgb, var(--panel) 90%, transparent)); }
  :root textarea { background: color-mix(in srgb, var(--bg) 80%, var(--panel)); }
  :root textarea:focus { outline: 1px solid rgba(var(--glow-b),.7); box-shadow: 0 0 0 4px rgba(var(--glow-b),.1); }
  :root .ibtn { background: color-mix(in srgb, var(--bg) 80%, var(--panel)); }
  :root #sendBtn, :root .btn.primary { background: var(--send-grad); box-shadow: 0 4px 14px -6px rgba(var(--glow-b),.8); }
  :root .hbtn:hover { color: var(--text); border-color: color-mix(in srgb, var(--border) 60%, var(--accent)); }
  :root dialog { box-shadow: 0 0 0 1px rgba(var(--glow-a),.12), 0 24px 60px -20px rgba(0,0,0,.6); }
  dialog::backdrop { background: rgba(3,5,12,.55); backdrop-filter: blur(3px); }
  .empty::before { content: ''; display: block; width: 46px; height: 46px; margin: 0 auto 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, color-mix(in srgb, var(--accent) 35%, #fff), var(--accent) 38%, color-mix(in srgb, var(--accent) 45%, #000) 72%, color-mix(in srgb, var(--accent) 15%, #000));
    box-shadow: 0 0 0 7px rgba(var(--glow-b),.07), 0 0 0 15px rgba(var(--glow-b),.04), 0 0 30px 4px rgba(var(--glow-b),.25); }
  /* Neon: tubes that actually glow. */
  [data-theme="neon"] header h1 { text-shadow: 0 0 10px rgba(var(--glow-b),.7), 0 0 22px rgba(var(--glow-b),.35); }
  [data-theme="neon"] .msg .bubble { border-color: rgba(var(--glow-c),.45); box-shadow: 0 0 0 1px rgba(var(--glow-c),.1), 0 0 16px -6px rgba(var(--glow-c),.5); }
  [data-theme="neon"] .msg.you .bubble { border-color: rgba(var(--glow-a),.6); box-shadow: 0 0 18px -4px rgba(var(--glow-a),.55); }
  [data-theme="neon"] .agent { border-color: rgba(var(--glow-c),.35); }
  [data-theme="neon"] #sendBtn, [data-theme="neon"] .btn.primary { box-shadow: 0 0 16px -2px rgba(var(--glow-b),.75); }
  [data-theme="neon"] textarea:focus { outline-color: rgba(var(--glow-a),.9); box-shadow: 0 0 14px rgba(var(--glow-a),.35); }
  [data-theme="neon"] dialog { box-shadow: 0 0 0 1px rgba(var(--glow-c),.4), 0 0 30px -8px rgba(var(--glow-b),.5), 0 24px 60px -20px #000; }
  [data-theme="synthwave"] header h1 { text-shadow: 0 0 14px rgba(var(--glow-a),.55); }
  [data-theme="terminal"] header h1 { text-shadow: 0 0 8px rgba(var(--glow-b),.6); }
  [data-theme="terminal"] .msg .bubble, [data-theme="terminal"] .agent { border-radius: 4px; }

  /* ---- Theme picker ---- */
  #themeGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tcard { position: relative; text-align: left; padding: 10px; min-height: 104px; border-radius: 12px; border: 2px solid var(--border); color: var(--text);
    background: var(--deco), var(--bg); font-family: var(--font-body); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; overflow: hidden; }
  .tcard:hover { border-color: color-mix(in srgb, var(--border) 50%, var(--accent)); }
  .tcard.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 16px -4px rgba(var(--glow-b),.6); }
  .tcard .tn { font-weight: 650; font-size: 14px; }
  .tcard .td { font-size: 11px; color: var(--muted); }
  .tcard .tprev { display: grid; gap: 4px; }
  .tcard .tb { height: 9px; border-radius: 5px; background: var(--panel); border: 1px solid var(--border); width: 78%; }
  .tcard .tb.y { background: var(--you); border: 0; width: 56%; justify-self: end; }
  .tcard .tdots { display: flex; gap: 4px; }
  .tcard .tdots i { width: 10px; height: 10px; border-radius: 50%; }
  .tcard.auto { background: linear-gradient(110deg, #faf9f5 50%, #0d1117 50%); }
  .tcard.auto .tn { color: #888; mix-blend-mode: difference; }
.prev-wait{display:grid;place-items:center;gap:10px;text-align:center;min-height:40vh;padding:16px;border:1px solid #444;border-radius:6px}
.prev-dots{display:flex;gap:7px}.prev-dots i{width:11px;height:11px;border-radius:50%;background:#d97757;animation:prevPulse 1.2s infinite ease-in-out}.prev-dots i:nth-child(2){animation-delay:.15s}.prev-dots i:nth-child(3){animation-delay:.3s}
@keyframes prevPulse{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1.15)}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="menuBtn" title="Crew list"><i data-ic="menu"></i></button>
  <span id="conn" title="Disconnected"></span>
  <img id="logo" src="/icon-192.png" alt="" width="26" height="26">
  <h1>Claude Crew <small id="ver" style="font-size:11px;font-weight:400;color:var(--muted)"></small></h1>
  <button class="hbtn" id="usageBtn" title="Plan usage">
    <span class="meter"><span class="lbl"><span>5h</span><span id="u5">–</span></span><span class="bar" id="b5"><i></i></span></span>
    <span class="meter"><span class="lbl"><span>Week</span><span id="uw">–</span></span><span class="bar" id="bw"><i></i></span></span>
    <span class="meter" id="mf" hidden><span class="lbl"><span>Fable</span><span id="uf">–</span></span><span class="bar" id="bf"><i></i></span></span>
  </button>
  <span class="spacer"></span>
  <button class="hbtn" id="ctlBtn" title="Let the crew control the mouse, keyboard and game"><i data-ic="mouse"></i> Control: OFF</button>
  <button class="hbtn" id="pauseAllBtn" title="Freeze all work in place; press again to resume"><i data-ic="pause"></i> Pause all</button>
  <button class="hbtn" id="stopAllBtn" title="Stop every agent now" style="background:#a22;color:#fff"><i data-ic="stop"></i> Stop all</button>
  <button class="hbtn on" id="updBtn" hidden></button>
  <button class="hbtn" id="moreBtn" title="Menu"><i data-ic="menu"></i><span class="wide"> Menu</span></button>
  <div id="hscrim"></div>
  <div id="hmore">
  <div class="dsec">WORK</div>
  <button class="hbtn" id="pinBtn" title="Pinned messages"><i data-ic="pin"></i><span class="wide"> Pins</span> <span id="pinCount"></span></button>
  <button class="hbtn" id="prevBtn" title="Live previews of web apps the crew is building"><i data-ic="eye"></i><span class="wide"> Preview</span> <span id="prevCount" class="small"></span></button>
  <button class="hbtn" id="statBtn" title="What is stuck and who it is waiting on, plus the latest crew updates"><i data-ic="blocked"></i><span class="wide"> Blocked &amp; status</span> <span id="statCount" class="small"></span></button>
  <div class="dsec">AUTOMATE</div>
  <button class="hbtn" id="autoBtn" title="Rules that react to what the crew does"><i data-ic="bolt"></i><span class="wide"> Automations</span> <span id="autoCount" class="small"></span></button>
  <button class="hbtn" id="schedBtn" title="Scheduled jobs"><i data-ic="clock"></i><span class="wide"> Schedules</span></button>
  <div class="dsec">SYSTEM</div>
  <button class="hbtn" id="setBtn" title="Crew settings: your name, main helper, how many agents work at once, phone access"><i data-ic="gear"></i><span class="wide"> Settings</span></button>
  <button class="hbtn" id="actBtn" title="Show what agents are doing step by step"><i data-ic="gear"></i><span class="wide"> Activity</span></button>
  <button class="hbtn" id="credBtn" title="Save logins here instead of typing them in chat"><i data-ic="key"></i><span class="wide"> Credentials</span></button>
  <button class="hbtn" id="intBtn" title="What is linked and who can use it"><i data-ic="plug"></i><span class="wide"> Integrations</span></button>
  <button class="hbtn" id="machBtn" title="Machines running Crew"><i data-ic="monitor"></i><span class="wide"> Machines</span></button>
  <button class="hbtn" id="themeBtn" title="Change how Crew looks"><i data-ic="palette"></i><span class="wide"> Theme: </span><span id="themeName"></span></button>
  <button class="hbtn" id="tourBtn" title="Replay the guided tour"><i data-ic="eye"></i><span class="wide"> Take the tour</span></button>
  <button class="hbtn" id="notifyBtn"title="Notifications"><i data-ic="bell"></i><span class="wide"> Notifications</span></button>
  <button class="hbtn" id="restartBtn" title="Restart the Crew server (stops running agents)"><i data-ic="refresh"></i><span class="wide"> Restart Crew</span></button>
  <a class="hbtn" id="signOut" href="#" hidden style="text-decoration:none"><i data-ic="logout"></i><span class="wide"> Sign out</span></a>
  </div>
</header>
<div id="shell">
<div id="scrim"></div>
<div id="agents"><button id="newAgBtn" class="hbtn" title="Create a new agent"><i data-ic="plus"></i> New agent</button><button id="allBtn" class="sel"><i data-ic="chat"></i> All crew</button><button id="grpBtn" class="hbtn"><i data-ic="users"></i> Group chat</button></div>
<div id="chatcol">
<div id="selBar"><span class="grow" id="selName"></span><button class="hbtn" id="selMention">@ mention</button><button class="hbtn" id="selPop" title="Open in its own window"><i data-ic="popout"></i> Pop out</button><button class="hbtn" id="selAll">Show all</button></div>
<div id="tray"></div>
<main id="scroller"><div id="log"></div></main>
<footer>
  <div id="held"><span id="heldText"></span><button class="btn primary" id="overrideBtn">Run anyway</button></div>
  <div id="chips"></div>
  <div class="composer">
    <button class="ibtn" id="attachBtn" title="Attach photos or files"><i data-ic="clip"></i></button>
    <input type="file" id="fileInput" multiple hidden accept="image/*,application/pdf,text/plain,.md,.log,.csv,.json,.txt">
    <textarea id="input" rows="1" placeholder="Message the crew…"></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>
</div>
</div>

<dialog id="usageDlg">
  <div class="dlg-head"><h3>Plan usage</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="usageBody"></div>
</dialog>
<dialog id="pinDlg">
  <div class="dlg-head"><h3>Pinned messages</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="pinBody"></div>
</dialog>
<dialog id="prevDlg" style="width:min(1100px,96vw)">
  <div class="dlg-head"><h3>App previews</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="prevBody"></div>
</dialog>
<dialog id="themeDlg" style="width:min(560px,96vw)">
  <div class="dlg-head"><h3>Theme</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body"><div id="themeGrid"></div></div>
</dialog>
<dialog id="machDlg">
  <div class="dlg-head"><h3>Machines</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="machBody"></div>
</dialog>
<dialog id="intDlg">
  <div class="dlg-head"><h3>Integrations</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="intBody"></div>
</dialog>
<dialog id="credDlg">
  <div class="dlg-head"><h3>Credentials</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="credBody"></div>
</dialog>
<dialog id="setDlg">
  <div class="dlg-head"><h3>Crew settings</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="setBody"></div>
</dialog>
<dialog id="cfDlg">
  <div class="dlg-head"><h3>Internet access</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="cfBody"></div>
</dialog>
<dialog id="statDlg">
  <div class="dlg-head"><h3>Blocked &amp; status</h3><button class="x" data-close>×</button></div>
  <div class="dlg-body" id="statBody"></div>
</dialog>
<dialog id="autoDlg">

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  // Line icons: 16px viewBox, stroke only, currentColor, round caps (style set by .ic in CSS).
  const IC = {

    lock: '<rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>',

    hourglass: 'M4 2.5h8M4 13.5h8M4.5 2.5c0 3 3.5 3.5 3.5 5.5s-3.5 2.5-3.5 5.5M11.5 2.5c0 3-3.5 3.5-3.5 5.5s3.5 2.5 3.5 5.5',
    flag: 'M4 14V2.5M4 3h8l-1.5 3L12 9H4',
    user: '<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/>',
    moon: 'M13 9.5A5.5 5.5 0 1 1 6.5 3 4.5 4.5 0 0 0 13 9.5z',

    send: 'M14 2L7 9M14 2l-4.5 12-2.5-5-5-2.5z',
    inbox: 'M2 9l2-6h8l2 6v4H2zM2 9h4l.5 1.5h3L10 9h4',
    sparkle: 'M8 2v3M8 11v3M2 8h3M11 8h3M4 4l1.5 1.5M10.5 10.5L12 12M12 4l-1.5 1.5M5.5 10.5L4 12',
    ruler: '<rect x="1.5" y="5.5" width="13" height="5" rx="1"/><path d="M4.5 5.5v2M7 5.5v3M9.5 5.5v2M12 5.5v3"/>',
    timer: '<circle cx="8" cy="9" r="5"/><path d="M8 9V6.5M6.5 2h3"/>',
    alarm: '<circle cx="8" cy="9" r="5"/><path d="M8 6.5V9l1.5 1M3 3l2 1.5M13 3l-2 1.5"/>',
    megaphone: 'M3 6.5v3h2l5 3.5V3L5 6.5zM13 6v4',
    search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
    broom: 'M10 2l-3.5 5.5M5 7.5l3.5 2-2.5 4.5H2.5z',
    scissors: '<circle cx="4.5" cy="4.5" r="1.8"/><circle cx="4.5" cy="11.5" r="1.8"/><path d="M6 5.5L14 12M6 10.5L14 4"/>',
    home: 'M2.5 8L8 3l5.5 5M4 7v6.5h8V7',
    code: 'M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5',
    volume: 'M2.5 6h2.5L8.5 3v10L5 10H2.5zM11 5.5a3.5 3.5 0 0 1 0 5',
    at: '<circle cx="8" cy="8" r="2.2"/><path d="M10.2 8v1a1.8 1.8 0 0 0 3.6 0V8a5.8 5.8 0 1 0-2.3 4.6"/>',
  };
  const ic = (n) => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${(IC[n] || '').startsWith('<') ? IC[n] : `<path d="${IC[n] || ''}"/>`}</svg>`;
  const icn = (n) => { const e = document.createElement('i'); e.setAttribute('data-ic', n); e.innerHTML = ic(n); return e; };
  document.querySelectorAll('i[data-ic]').forEach((e) => { e.innerHTML = ic(e.dataset.ic); });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch {}
      if (k.startsWith('crew-')) fetch('/api/prefs', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Crew': '1' }, body: JSON.stringify({ key: k, value: String(v) }) }).catch(() => {});
    },
  };
  // layout prefs (order, groups, slim, ...) live on the server so a refresh or another browser keeps them
  try {
    const x = new XMLHttpRequest(); x.open('GET', '/api/prefs', false); x.send();
    if (x.status === 200) {
      const sp = JSON.parse(x.responseText) || {};
      for (const k of Object.keys(sp)) { try { localStorage.setItem(k, sp[k]); } catch {} }
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('crew-') && !(k in sp) && k !== 'crew-theme') store.set(k, localStorage.getItem(k)); }
    }
  } catch {}
  const THEMES = [
    ['space', 'Deep space', 'Navy, stars, orange'], ['neon', 'Neon Lights', 'Magenta and cyan glow'], ['synthwave', 'Synthwave', 'Purple, sunset horizon'],
    ['terminal', 'Terminal', 'Green on black'], ['forest', 'Forest', 'Northern-light greens'], ['ocean', 'Ocean', 'Deep teal'],
    ['midnight', 'Midnight', 'Clean blue dark'], ['dark', 'Ember', 'Warm charcoal'],
    ['light', 'Daylight', 'Bright and warm'], ['slate', 'Slate', 'Cool grey light'], ['sepia', 'Paper', 'Soft cream'], ['auto', 'Auto', 'Follows your device'],
  ];
  const applyTheme = (t) => {
    if (t && t !== 'auto') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#1f1e1d';
    const th = THEMES.find((x) => x[0] === t); const n = $('#themeName'); if (n && th) n.textContent = th[1];
  };
  // Deep space is the default; the old unset/"dark" choice moves to it once. Sunset became Synthwave.
  if (!store.get('crew-theme-v2')) { if (['', 'dark'].includes(store.get('crew-theme') || '')) store.set('crew-theme', 'space'); store.set('crew-theme-v2', '1'); }
  if (store.get('crew-theme') === 'sunset') store.set('crew-theme', 'synthwave');
  let curTheme = store.get('crew-theme') || 'space'; if (!THEMES.some((x) => x[0] === curTheme)) curTheme = 'space';
  applyTheme(curTheme);
  const drawThemes = () => {
    $('#themeGrid').innerHTML = THEMES.map(([id, name, sub]) => `<button class="tcard${id === 'auto' ? ' auto' : ''}${id === curTheme ? ' sel' : ''}" data-id="${id}"${id === 'auto' ? '' : ` data-theme="${id}"`}>
      <span class="tprev"><span class="tb"></span><span class="tb y"></span></span>
      <span><span class="tn">${name}</span><br><span class="td">${sub}</span></span></button>`).join('');
    $('#themeGrid').querySelectorAll('.tcard').forEach((c) => c.onclick = () => { curTheme = c.dataset.id; store.set('crew-theme', curTheme); applyTheme(curTheme); drawThemes(); });
  };
  $('#themeBtn').onclick = () => { drawThemes(); open('#themeDlg'); };
  let agents = {};
  let procs = {};
  let order = [];
  let userName = 'You';
  let defaultAgent = '';
  let usage = null;
  let flags = {};
  let schedules = [];
  let modelChoices = [];
  let pushKey = '';
  const seen = new Set();
  const msgs = new Map(); // id -> { m, el }
  const drafts = new Map(); // agent id -> element

  // ---------- tiny, safe markdown ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function inline(s) {
    return s
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
      .replace(/^#{1,6}\s+(.*)$/gm, '<b>$1</b>');
  }
  function md(text) {
    const parts = esc(text).split(/```[^\n]*\n?/);
    return parts.map((p, i) => {
      if (i % 2) return `<pre><code>${p.replace(/\n$/, '')}</code></pre>`;
      return p.split(/\n{2,}/).filter((x) => x.trim()).map((para) => `<p>${inline(para.trim())}</p>`).join('');
    }).join('');
  }
  const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const pct = (u) => Math.round((u || 0) * 100);
  const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n || 0);
  const fmtDur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`; };
  const until = (t) => { const ms = t - Date.now(); if (ms <= 0) return 'now'; const m = Math.round(ms / 60000); return m < 60 ? `${m}m` : m < 1440 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${Math.floor(m / 1440)}d ${Math.floor(m % 1440 / 60)}h`; };
  const when = (t) => { const d = new Date(t); const today = new Date().toDateString() === d.toDateString(); return (today ? '' : d.toLocaleDateString([], { weekday: 'short' }) + ' ') + time(t); };
  function prettyModel(id) {
    if (!id) return '';
    const m = String(id).match(/(opus|sonnet|haiku|fable)-(\d+)(?:[-.](\d+))?/i);
    return m ? `${m[1][0].toUpperCase()}${m[1].slice(1)} ${m[2]}${m[3] ? '.' + m[3] : ''}` : String(id).replace(/^claude-/, '');
  }
  const tokens = (t) => (t.input || 0) + (t.output || 0) + (t.cacheRead || 0) + (t.cacheWrite || 0);

  // ---------- steampunk avatars ----------
  // Each agent gets a brass gear medallion with an etched emblem. Unknown ids fall back to a bare cog.
  // Private per-install values (built-in drawings, default groups, control-off stop rule); the server fills this in.
  const CREW_LOCAL = {};
  CREW_LOCAL.avatars ||= {}; CREW_LOCAL.groups ||= {}; CREW_LOCAL.stop ||= { match: '', except: [] };
  const SP = (() => {
    const gearPath = (cx, cy, r, R, n) => {
      let d = '';
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, w = Math.PI / n * 0.55;
        const pts = [[r, a - w * 1.25], [R, a - w * 0.7], [R, a + w * 0.7], [r, a + w * 1.25]];
        for (const [rr, aa] of pts) d += (d ? 'L' : 'M') + (cx + rr * Math.cos(aa)).toFixed(2) + ' ' + (cy + rr * Math.sin(aa)).toFixed(2);
        const an = a + Math.PI / n;
        d += 'A' + r + ' ' + r + ' 0 0 1 ' + (cx + r * Math.cos(an + w * 0.1)).toFixed(2) + ' ' + (cy + r * Math.sin(an + w * 0.1)).toFixed(2);
      }
      return d + 'Z';
    };
    const rivets = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => {
      const a = i / 8 * Math.PI * 2 + Math.PI / 8;
      return `<circle cx="${(32 + 21.5 * Math.cos(a)).toFixed(1)}" cy="${(32 + 21.5 * Math.sin(a)).toFixed(1)}" r="1.1" fill="#f3d58a" stroke="#5a3a12" stroke-width=".4"/>`;
    }).join('');
    const frame = (emblem, face) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <defs>
        <radialGradient id="b" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f7dc8c"/><stop offset=".45" stop-color="#c8942f"/><stop offset="1" stop-color="#6b4413"/></radialGradient>
        <radialGradient id="f" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="${face[0]}"/><stop offset="1" stop-color="${face[1]}"/></radialGradient>
        <linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c98a2a"/></linearGradient>
      </defs>
      <path d="${gearPath(32, 32, 27, 31.5, 14)}" fill="url(#b)" stroke="#4a2c0b" stroke-width="1"/>
      <circle cx="32" cy="32" r="24" fill="#3a2410" stroke="#e8c26a" stroke-width="1"/>
      <circle cx="32" cy="32" r="19.5" fill="url(#f)" stroke="#8a5a1c" stroke-width="1.2"/>
      ${rivets}
      <g fill="url(#e)" stroke="#3b230a" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round">${emblem}</g>
    </svg>`;
    const E = {
      // Compass rose: the coordinator
      assistant: [`<path d="M32 15 L35 29 L32 32 L29 29Z"/><path d="M32 49 L29 35 L32 32 L35 35Z" fill="#9c6a22"/>
        <path d="M15 32 L29 29 L32 32 L29 35Z" fill="#9c6a22"/><path d="M49 32 L35 35 L32 32 L35 29Z"/>
        <circle cx="32" cy="32" r="2.4" fill="#2a1a08"/>`, ['#1f3a3a', '#0c1a1c']],
      _: [`<path d="${gearPath(32, 32, 8, 11, 8)}"/><circle cx="32" cy="32" r="3.5" fill="#2a1a08"/>`, ['#2a2a2a', '#111']],
    };
    const cache = {};
    return (id) => cache[id] ??= 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(frame(...(CREW_LOCAL.avatars[id] || E[id] || E._)));
  })();
  // Custom icons (browser-saved): an emoji per agent, drawn as an SVG data URL so it works anywhere an <img> does.
  let crewIcons = (() => { try { return JSON.parse(store.get('crew-icons')) || {}; } catch { return {}; } })();
  const emojiSrc = (e) => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="32" y="32" font-size="46" text-anchor="middle" dominant-baseline="central">${e.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</text></svg>`);
  let crewPics = (() => { try { return JSON.parse(store.get('crew-pics')) || {}; } catch { return {}; } })();
  const iconSrc = (id) => (crewPics[id] || (crewIcons[id] ? emojiSrc(crewIcons[id]) : agents[id]?.avatar ? `/avatars/${id}.png` : SP(id)));
  const avatar = (id, cls = '') => `<img class="spav ${cls}" src="${iconSrc(id)}" alt="">`;

  // ---------- dialogs ----------
  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
    d.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); d.close(); } });
  });
  const open = (id) => { const d = $(id); if (!d.open) d.showModal(); };

  // ---------- usage meter ----------
  function setBar(bar, u) {
    bar.classList.toggle('warn', u >= 0.7 && u < 0.9);
    bar.classList.toggle('hot', u >= 0.9);
    bar.querySelector('i').style.width = Math.min(100, pct(u)) + '%';
  }
  function renderUsage() {
    const l = usage?.limits;
    const f = l?.fiveHour, w = l?.weekly;
    $('#u5').textContent = f ? pct(f.utilization) + '%' : '–';
    $('#uw').textContent = w ? pct(w.utilization) + '%' : '–';
    setBar($('#b5'), f?.utilization || 0);
    setBar($('#bw'), w?.utilization || 0);
    // Fable has its own weekly bucket. Only show it once something has been used.
    const fb = l?.fable, fableOn = !!(fb && fb.utilization > 0);
    $('#mf').hidden = !fableOn;
    if (fableOn) { $('#uf').textContent = pct(fb.utilization) + '%'; setBar($('#bf'), fb.utilization); }
    $('#usageBtn').title = l ? `5-hour: ${pct(f?.utilization)}%${f?.resetsAt ? `, resets in ${until(f.resetsAt)}` : ''}\nWeekly: ${pct(w?.utilization)}%${w?.resetsAt ? `, resets in ${until(w.resetsAt)}` : ''}${fableOn ? `\nFable this week: ${pct(fb.utilization)}%${fb.resetsAt ? `, resets in ${until(fb.resetsAt)}` : ''}` : ''}\nUpdated ${when(l.updatedAt)}` : 'No usage reading yet: it arrives with the next agent reply.';
    const g = usage?.guard;
    $('#held').classList.toggle('on', !!g && Object.values(agents).some((a) => a.status === 'held'));
    if (g) $('#heldText').textContent = `Holding new work: ${g.window} usage is ${pct(g.utilization)}% (guard at ${pct(g.threshold)}%). Resumes ${when(g.resumesAt)}.`;
    if ($('#usageDlg').open) renderUsageDialog();
  }
  function renderUsageDialog() {
    const l = usage?.limits;
    const win = (name, w) => `<div class="section"><div class="row"><b class="grow">${name}</b><span>${w ? pct(w.utilization) + '%' : '–'}</span></div>
      <div class="bar big ${w && w.utilization >= 0.9 ? 'hot' : w && w.utilization >= 0.7 ? 'warn' : ''}"><i style="width:${w ? Math.min(100, pct(w.utilization)) : 0}%"></i></div>

  // ---------- agents strip: order, pins, colours (saved per browser) ----------
  const COLORS = { orange: '#e8833a', red: '#d9534f', crimson: '#b5303f', coral: '#f07167', pink: '#d96aa7', magenta: '#c2379d', purple: '#9b6bd6', violet: '#6f5bd6', indigo: '#4c5fc4', blue: '#4a90d9', sky: '#5bbcf0', cyan: '#2cc4d6', teal: '#2fa7a0', mint: '#5fd1a5', green: '#4caf6a', lime: '#9acd3c', olive: '#8a9a3b', gold: '#c9a227', amber: '#f0b429', brown: '#9a6b47', slate: '#7b8794', silver: '#b8bec6' };
  const colorOf = (v) => COLORS[v] || (/^#[0-9a-f]{6}$/i.test(v || '') ? v : '');
  const loadJ = (k, d) => { try { return JSON.parse(store.get(k)) || d; } catch { return d; } };
  let crewOrder = loadJ('crew-order', []), crewPins = loadJ('crew-pins', []), crewColors = loadJ('crew-colors', {});
  let crewGroups = loadJ('crew-groups', CREW_LOCAL.groups), crewCollapsed = loadJ('crew-collapsed', {}), crewSlim = loadJ('crew-slim', {});
  function sortedIds() {
    const ids = Object.keys(agents);
    const rank = (id) => { const i = crewOrder.indexOf(id); return i < 0 ? 1e6 + ids.indexOf(id) : i; };
    return ids.sort((x, y) => (crewPins.includes(y) - crewPins.includes(x)) || rank(x) - rank(y));
  }
  function groupEl(g) {
    const box = $('#agents');
    let el = [...box.querySelectorAll('.agrp')].find((x) => x.dataset.g === g);
    if (el) return el;
    el = document.createElement('div');
    el.className = 'agrp'; el.dataset.g = g;
    el.innerHTML = '<div class="agrp-h"><span class="chev"></span><span class="gn"></span><span class="ct"></span><span class="gs"></span><span class="tb">'
      + '<button data-s title="Size: full → compact → slim (name + light only)"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg></button>'
      + '<button data-n title="Notes / to-do"><svg viewBox="0 0 16 16"><rect x="3" y="2.5" width="10" height="11" rx="2"/><path d="M6 6h4M6 9h4"/></svg></button>'
      + '<button data-r title="Rename group"><svg viewBox="0 0 16 16"><path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z"/></svg></button></span></div><div class="agrp-b"></div>';
    el.querySelector('.agrp-h').onclick = (ev) => {
      if (ev.target.closest('button')) return;
      crewCollapsed[g] = !crewCollapsed[g]; if (!crewCollapsed[g]) delete crewCollapsed[g];
      store.set('crew-collapsed', JSON.stringify(crewCollapsed)); paintGroups();
    };
    el.querySelector('[data-s]').onclick = e => {
      e.stopPropagation(); crewSlim[g] = ((crewSlim[g] || 0) + 1) % 3; if (!crewSlim[g]) delete crewSlim[g];
      store.set('crew-slim', JSON.stringify(crewSlim)); paintGroups();
    };
    el.querySelector('[data-n]').onclick = () => openNotes(g);
    el.querySelector('[data-r]').onclick = () => {
      const n = (prompt('Rename group (blank = ungroup all)', g) || '').trim();
      if (n === g) return;
      Object.keys(crewGroups).forEach((id) => { if (crewGroups[id] === g) { if (n) crewGroups[id] = n; else delete crewGroups[id]; } });
      if (crewCollapsed[g]) { if (n) crewCollapsed[n] = true; delete crewCollapsed[g]; store.set('crew-collapsed', JSON.stringify(crewCollapsed)); }
      saveCrewPrefs();
    };
    el.ondragover = (ev) => { ev.preventDefault(); el.classList.add('dragover'); };
    el.ondragleave = () => el.classList.remove('dragover');
    el.ondrop = (ev) => {
      ev.preventDefault(); ev.stopPropagation(); el.classList.remove('dragover');
      const from = ev.dataTransfer.getData('text/plain');

    };

  }
  async function openNotes(g) {
    $('#notesTitle').textContent = 'Notes · ' + g;
    const all = await fetch('/api/notes').then((r) => r.json()).catch(() => ({}));
    let items = all[g] || [];
    const save = () => api('/api/notes', { group: g, items });
    const draw = () => {
      const row = (i, n) => `<div class="row" style="gap:8px;align-items:center;padding:3px 0"><input type="checkbox" data-t="${i}" ${n.done ? 'checked' : ''}><span class="grow" style="${n.done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(n.text)}</span><button class="btn" data-d="${i}" title="Delete">×</button></div>`;
      const todo = items.map((n, i) => [i, n]).filter(([, n]) => !n.done), done = items.map((n, i) => [i, n]).filter(([, n]) => n.done);
      $('#notesBody').innerHTML = `<div class="row"><input id="noteNew" class="grow" placeholder="Add a to-do…"><button class="btn" id="noteAdd">Add</button></div>
        <div class="section"><h5>To do (${todo.length})</h5>${todo.map(([i, n]) => row(i, n)).join('') || '<div class="small">Nothing open.</div>'}</div>
        <div class="section"><h5>Done (${done.length})</h5>${done.map(([i, n]) => row(i, n)).join('') || '<div class="small">Nothing yet.</div>'}</div>`;
      const add = () => { const v = $('#noteNew').value.trim(); if (!v) return; items.unshift({ text: v, done: false }); save(); draw(); };
      $('#noteAdd').onclick = add;
      $('#noteNew').onkeydown = (e) => { if (e.key === 'Enter') add(); };
      $('#notesBody').querySelectorAll('[data-t]').forEach((c) => c.onchange = () => { items[+c.dataset.t].done = c.checked; save(); draw(); });
      $('#notesBody').querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { items.splice(+b.dataset.d, 1); save(); draw(); });
    };

  function paintGroups() {
    document.querySelectorAll('#agents .agrp').forEach((el) => {
      const g = el.dataset.g, ids = Object.keys(crewGroups).filter((id) => crewGroups[id] === g && agents[id]);
      const working = ids.filter((id) => agents[id].status === 'working').length, need = ids.filter((id) => agents[id].needsYou).length;

  function saveCrewPrefs() {
    store.set('crew-order', JSON.stringify(crewOrder)); store.set('crew-pins', JSON.stringify(crewPins)); store.set('crew-colors', JSON.stringify(crewColors));

  function paintMsg(el, from) { const c = colorOf(crewColors[from]); if (c) el.style.setProperty('--ac', c); else el.style.removeProperty('--ac'); }
  function moveAgent(id, dir) {
    const ids = sortedIds(), i = ids.indexOf(id), j = i + dir;

  // ---------- Claude-style "working" spinner ----------
  // A small orange starburst: twelve rounded rays (long and short, alternating) that
  // slowly turn while each ray stretches and shrinks a little after its neighbour,
  // so the burst ripples smoothly. Pure CSS animation (see .spark in the styles).
  const SPARK_SVG = (() => {
    let rays = '';
    for (let i = 0; i < 12; i++) {
      const len = i % 2 ? 6.4 : 9.6; // ray reaches from the centre (12,12) toward the edge
      rays += `<g transform="rotate(${i * 30} 12 12)"><line x1="12" y1="12" x2="12" y2="${(12 - len).toFixed(1)}" style="animation-delay:${(-i * 0.11).toFixed(2)}s"/></g>`;
    }
    return `<svg viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.3" stroke-linecap="round">${rays}</svg>`;
  })();

  // ---------- agents strip ----------
  // Tag messages that are waiting in an agent's queue so a busy agent doesn't look locked up.
  function updateQueued() {
    const want = new Set();
    for (const a of Object.values(agents)) {
      let n = a.queued || 0;
      if (!n) continue;
      const list = [...msgs.values()];
      for (let i = list.length - 1; i >= 0 && n > 0; i--) {
        const m = list[i].m;
        if (m.kind === 'chat' && m.from !== a.id && (m.to || []).includes(a.id)) { want.add(m.id + '|' + a.id); n--; }
      }
    }
    document.querySelectorAll('.tag.qd').forEach((t) => { if (!want.has(t.dataset.k)) t.remove(); });
    for (const k of want) {
      const [id, ag] = k.split('|'); const e = msgs.get(id)?.el; if (!e) continue;
      if ([...e.querySelectorAll('.tag.qd')].some((t) => t.dataset.k === k)) continue;
      const t = document.createElement('span'); t.className = 'tag qd'; t.dataset.k = k;
      t.title = nameOf(ag) + ' is busy; this message is waiting its turn'; t.textContent = 'QUEUED';
      e.querySelector('.meta')?.appendChild(t);
    }
  }
  setInterval(updateQueued, 1500);
